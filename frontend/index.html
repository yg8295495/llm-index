  const unranked = rows.filter(r => r.score == null);
  ranked.sort((a, b) => b.score - a.score);
  unranked.sort((a, b) => (b.price == null ? -1 : b.price));
  ranked.forEach((r, i) => { r.rank = i + 1; });

  const baseId = getBaselineId();
  const baseScore = baseId != null ? boardScore(baseId, state.board) : null;
  const dimKeys = ['factual', 'workflow', 'engineering', 'preference'];

  let html = '<div class="matrix-view">';
  html += '<div class="schemes-toolbar"><div class="schemes-title">'
    + (active.name || '榜单') + '</div>';
  html += boards.map(k => `<button class="action-btn ${state.board === k ? 'active' : ''}" `
    + `data-board="${k}" title="${(LB[k] || {}).caption || ''}">${(LB[k] || {}).name || k}</button>`).join('');
  html += `<button class="action-btn ${state.includeReference ? 'active' : ''}" id="board-toggle-ref" `
    + `data-tooltip="参照模型不在九家范围内，默认不占名次">含参照模型</button></div>`;

  const sc = DATA.metadata.scoring || {};
  html += `<div class="board-caption">${(active.caption || '')}`;
  if (state.board === 'capability') {
    const w = sc.capability_weights || {};
    html += '　固定权重口径：' + Object.keys(w).map(d => `${dimName(d)} ${Math.round(w[d] * 100)}%`).join(' + ');
    if (sc.preference_status === 'empty_reweighted') {
      html += '；<span class="src-badge inline">人类偏好本批无数据</span>，其权重已重新分配';
    }
  } else if (state.board === 'value') {
    html += '　公式：' + (sc.value_formula || '能力分 ÷ 混合单价')
      + '；混合单价按输入:输出 = 3:1 估算，展示分是把该比值在本批内做 min-max';
  } else {
    const w = sc.weights_in_effect || {};
    html += '　随你在「我的方案」里改的权重实时变化：'
      + Object.keys(w).map(d => `${dimName(d)} ${Math.round(w[d] * 100)}%`).join(' + ');
  }
  html += '</div>';

  const cols = '140px ' + dimKeys.map(() => 'minmax(56px,1fr)').join(' ') + ' minmax(78px,1fr) minmax(64px,1fr) minmax(62px,1fr)';
  html += '<div class="matrix-table"><div class="matrix-grid" style="grid-template-columns:' + cols + '">';
  html += '<div class="matrix-row"><div class="matrix-row-label">模型</div>';
  dimKeys.forEach(d => { html += `<div class="matrix-bench-header">${dimName(d)}</div>`; });
  html += '<div class="matrix-bench-header" data-tooltip="AA 公布定价推算的混合单价，USD / 1M tokens">混合单价</div>';
  html += `<div class="matrix-bench-header">${active.name || '榜分'}</div>`;
  html += '<div class="matrix-bench-header" data-tooltip="与所选基准模型的榜分差值">vs 基准</div></div>';

  const rowHtml = (r) => {
    const m = getModel(r.id);
    const dims = (m.scores || {}).dims || {};
    let cells = `<div class="matrix-row-label${r.ref ? ' is-reference' : ''}" `
      + `data-model="${r.id}" style="cursor:pointer" `
      + `data-tooltip="${r.ref ? '参照 · 不在九家范围' : m.id}">${m.display_name || r.id}`
      + `${r.ref ? ' <span class="src-badge inline">参照</span>' : ''}</div>`;
    dimKeys.forEach(d => {
      const v = dims[d];
      cells += `<div class="matrix-cell${r.ref ? ' is-reference' : ''}">${v != null ? v.toFixed(1) : '—'}</div>`;
    });
    cells += `<div class="matrix-cell${r.ref ? ' is-reference' : ''}">${r.price != null ? '$' + r.price.toFixed(2) : '—'}</div>`;
    cells += `<div class="matrix-cell board-score${r.ref ? ' is-reference' : ''}">`
      + `<b>${r.score != null ? r.score.toFixed(1) : '—'}</b>`
      + `${r.rank ? `<span class="board-rank">#${r.rank}</span>` : ''}</div>`;
    let delta = '—';
    if (r.score != null && baseScore != null && r.id !== baseId) {
      const d = r.score - baseScore;
      delta = `<span class="${d >= 0 ? 'delta-up' : 'delta-down'}">${d >= 0 ? '+' : ''}${d.toFixed(1)}</span>`;
    } else if (r.id === baseId) { delta = '<span class="delta-base">基准</span>'; }
    cells += `<div class="matrix-cell${r.ref ? ' is-reference' : ''}">${delta}</div>`;
    return `<div class="matrix-row">${cells}</div>`;
  };

  ranked.forEach(r => { html += rowHtml(r); });
  unranked.forEach(r => { html += rowHtml(r); });
  html += '</div></div>';
  html += `<div class="board-footnote">榜分与维度分均为 0–100 的批内相对值（min-max），`
    + `只在本批 ${DATA.metadata.core_model_count} 个核心模型之间可比，跨批次不可直接比大小。`
    + `数据截止 ${DATA.metadata.snapshot_date}，来源见「数据说明」。</div>`;

  // 厂商自报数据：AA 未收录该模型时单独列出，绝不混进上面的归一化榜
  const official = Object.values(DATA.models).filter(m => (m.official_metrics || []).length);
  if (official.length > 0) {
    html += '<div class="doc-card" style="margin-top:16px"><div class="doc-card-title">'
      + '厂商自报数据 <span class="doc-card-sub">AA 未收录 · 不参与上方任何榜单计算</span></div>';
    official.forEach(m => {
      html += `<div class="official-block"><div class="official-name">${esc(m.display_name)}`
        + ` <span class="src-badge inline">自报口径</span></div><ul class="official-list">`;
      m.official_metrics.forEach(o => {
        html += `<li><a class="src-link" href="${esc(o.source_url)}" target="_blank" rel="noopener">${esc(o.name)}</a>`
          + ` <b>${esc(o.value)}</b> <span class="official-unit">${esc(o.unit)}</span>`
          + (o.note ? `<div class="official-note">${esc(o.note)}</div>` : '') + '</li>';
      });
      html += '</ul></div>';
    });
    html += '<div class="official-caveat">这些数字由厂商自行发布，评测实现与采样设置'
      + '与 Artificial Analysis 不同口径，因此本站不把它们与榜内分数放在一起比较。'
      + '可核验的反例：腾讯官方称 Hy3 在 Terminal-Bench 2.1 得 70.8，'
      + '而 AA 实测 Hy3 为 64.4 —— 差 6.4 分。</div></div>';
  }
  html += '</div>';

  main.innerHTML = html;

  main.querySelectorAll('[data-board]').forEach(btn => btn.addEventListener('click', () => {
    state.board = btn.dataset.board;
    renderBoardView();
  }));
  const toggle = main.querySelector('#board-toggle-ref');
  if (toggle) toggle.addEventListener('click', () => {
    state.includeReference = !state.includeReference;
    renderBoardView();
  });
  main.querySelectorAll('.matrix-row-label[data-model]').forEach(el => el.addEventListener('click', () => {
    state.view = 'ranking';
    document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === 'ranking'));
    state.expandedModel = el.dataset.model;
    renderCurrentView();
  }));
}

function dimName(key) {
  const d = DIMENSIONS.find(x => x.key === key);
  return d ? d.name : key;
}

// ===== RANKING VIEW =====
function renderRankingView() {
  const main = document.getElementById('main');
  const benchKey = state.activeBench;
  if (!benchKey || !DATA) {
    main.innerHTML = '<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">请选择一个评测</div></div>';
    return;
  }

  const meta = DATA.benchmark_meta[benchKey] || {};
  let ranking = getFilteredRanking(benchKey);
  const totalRanking = getBenchRanking(benchKey);
  const isCost = isCostBench(benchKey);

  // Apply ranking sort
  if (state.rankingSort.key === 'rank') {
    ranking.sort((a, b) => state.rankingSort.desc ? a.rank - b.rank : b.rank - a.rank);
  } else if (state.rankingSort.key === 'score') {
    ranking.sort((a, b) => {
      const va = a.score_raw ?? -Infinity;
      const vb = b.score_raw ?? -Infinity;
      return state.rankingSort.desc ? vb - va : va - vb;
    });
  } else if (state.rankingSort.key === 'composite') {
    ranking.sort((a, b) => {
      const va = getCompositeScore(a.model_id) ?? -Infinity;
      const vb = getCompositeScore(b.model_id) ?? -Infinity;
      return state.rankingSort.desc ? vb - va : va - vb;
    });
  } else if (state.rankingSort.key === 'cost') {
    const costBench = getCostProxyBench();
    const costR = costBench ? getBenchRanking(costBench) : [];
    const costOf = (id) => {
      const hit = costR.find(r => r.model_id === id);
      return hit && hit.score_raw != null ? hit.score_raw : Infinity;
    };
    // 成本：desc=false 表示越便宜越前
    ranking.sort((a, b) => state.rankingSort.desc
      ? costOf(b.model_id) - costOf(a.model_id)
      : costOf(a.model_id) - costOf(b.model_id));
  }

  const sortIcon = (key) => {
    if (state.rankingSort.key !== key) return ' <span style="opacity:.3">▲</span>';
    return state.rankingSort.desc ? ' ▼' : ' ▲';
  };

  // 出处信息：快照日 + 置信度 + 原始链接（每个数字都能追到源和日期）
  const snap = snapshotDate();
  const conf = meta.confidence;
  const costBenchKey = getCostProxyBench();
  const baselineId = getBaselineId();
  // 下拉：先给 config.baseline 的候选，再补其余模型（候选之外的模型也可作锚点）
  const baselineOptions = BASELINE_CANDIDATES.slice();
  Object.keys(DATA.models).sort().forEach(id => { if (baselineOptions.indexOf(id) < 0) baselineOptions.push(id); });
  if (baselineId && baselineOptions.indexOf(baselineId) < 0) baselineOptions.unshift(baselineId);
  const showBaselineCol = !!baselineId;

  let html = `<div class="bench-header" style="min-height:0;padding:4px 0">
    <div class="bench-header-left">
      <div class="rank-controls">
        ${showBaselineCol ? `<label class="ctl-label">基准
          <select class="ctl-select" id="baseline-select" title="「vs 基准」列的对比锚点，来自 config.baseline">
            ${baselineOptions.map(id => `<option value="${id}" ${id === baselineId ? 'selected' : ''}>${(getModel(id) || {}).display_name || id}</option>`).join('')}
          </select>
        </label>` : ''}
        <button class="action-btn ${state.includeReference ? 'active' : ''}" id="toggle-reference" data-tooltip="参照模型不在九家范围内，默认不进主榜排名">含参照模型</button>
      </div>
    </div>
    <div class="bench-header-right">
      <span class="bench-stat"><span class="bench-stat-val">${ranking.length}</span>/<span class="bench-stat-total">${totalRanking.length}</span> 条数据</span>
      ${meta.source ? `<span class="bench-stat">来源: ${meta.source}</span>` : ''}
      ${snap ? `<span class="bench-stat">AA 快照 ${snap}</span>` : ''}
      ${conf != null ? `<span class="bench-stat">置信度 <span class="bench-stat-val">${(conf * 100).toFixed(0)}%</span></span>` : ''}
      ${benchStatusBadge(benchKey)}
      ${meta.source_url ? `<a class="src-link" href="${meta.source_url}" target="_blank" rel="noopener">数据来源</a>` : ''}
    </div>
  </div>`;

  if (ranking.length === 0) {
    html += '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">当前筛选条件下无匹配数据</div></div>';
    main.innerHTML = html;
    bindRankingControls(benchKey);
    return;
  }

  const maxScore = totalRanking.length > 0 ? Math.max(...totalRanking.map(r => r.score_raw).filter(s => s != null)) : null;

  // 一行榜单（主榜与参照块共用）
  const renderRow = (item) => {
    const model = getModel(item.model_id);
    if (!model) return '';
    const expKey = item.model_id + '|' + (item.reasoning_level || '');
    const isExpanded = state.expandedModel === expKey;
    const rankClass = item.rank <= 3 ? `r${item.rank}` : '';
    const inCompare = state.compareList.includes(item.model_id);
    const scoreDisplay = isCost ? formatCost(item.score_raw) : formatScore(item.score_raw);
    const isCostZero = isCost && item.score_raw != null && item.score_raw === maxScore;
    const compScore = getCompositeScore(item.model_id);
    const compRank = getCompositeRank(item.model_id);
    const delta = showBaselineCol ? getBaselineDelta(item.model_id) : null;
    const isBaselineRow = showBaselineCol && item.model_id === baselineId;
    let deltaHtml = '—';
    if (isBaselineRow) deltaHtml = '<span class="delta-base">基准</span>';
    else if (delta != null) deltaHtml = `<span class="delta ${delta > 0 ? 'pos' : (delta < 0 ? 'neg' : '')}">${delta > 0 ? '+' : ''}${delta.toFixed(1)}</span>`;
    const costItem = costBenchKey ? getBenchRanking(costBenchKey).find(r => r.model_id === item.model_id) : null;
    const costText = costItem && costItem.score_raw != null ? formatCost(costItem.score_raw) + '/轮' : '';
    const costTokenText = costItem && costItem.breakdown && costItem.breakdown.input_per_1m != null
      ? '入$' + costItem.breakdown.input_per_1m + '/出$' + costItem.breakdown.output_per_1m : '';
    const subDimText = getSubDimText(item, benchKey);
    const refNote = isInScope(item.model_id) ? '' : '<div class="ref-note">参照 · 不在九家范围</div>';

    let row = `<div class="table-row ${isExpanded ? 'expanded' : ''} ${isInScope(item.model_id) ? '' : 'is-reference'}" data-model="${item.model_id}" data-reasoning="${item.reasoning_level || ''}">
      ${getMarkers(model)}
      <div class="rank ${rankClass}">No.${item.rank}</div>
      <div class="model-cell">
        <div class="model-name">${item.display_name || model.display_name}</div>
        <div class="model-id">${item.model_id}${item.reasoning_level ? ' · ' + item.reasoning_level : ''}${entryDate(item) ? ' · ' + entryDate(item) : ''}</div>
        ${refNote}
      </div>
      <div class="score-col">
        <div class="score ${isCostZero ? 'cost-zero' : ''}">${scoreDisplay}${isCostZero ? '<span class="cost-zero-badge">最贵</span>' : ''}</div>
      </div>
      <div class="subdim-col">${subDimText || '—'}</div>
      <div class="comp-col">
        ${compRank ? '<span class="comp-rank-badge">No.' + compRank + '</span>' : ''}
        <span class="comp-score">${compScore != null ? compScore.toFixed(1) : '—'}</span>
      </div>
      <div class="baseline-col">${showBaselineCol ? deltaHtml : ''}</div>
      <div class="cost-col">
        ${costText ? '<span class="cost-val">' + costText + '</span>' : ''}
        ${costTokenText ? '<span class="token-val">' + costTokenText + '</span>' : ''}
      </div>
      <div class="compare-col">
        <button class="action-btn ${inCompare ? 'active' : ''}" data-action="compare" data-model="${item.model_id}">${inCompare ? '✓' : '对比'}</button>
      </div>
      <div class="expand-col">
        <span class="expand-arrow ${isExpanded ? 'open' : ''}">▸</span>
      </div>
    </div>`;

    if (isExpanded) row += renderDrilldownHTML(item, benchKey);
    return row;
  };

  // in_scope 进主榜；参照模型默认单独成块（灰显），开「含参照模型」后并入主榜但仍带标记
  const refSplit = state.includeReference ? { main: ranking, refs: [] } : splitReference(ranking);
  const colCount = showBaselineCol ? 10 : 9;
  const headerCells = `<div class="th-mark">标记</div><div class="th-sortable th-rank" data-sort="rank" style="cursor:pointer">排名${sortIcon('rank')}</div><div class="th-model">模型</div><div class="th-sortable th-score" data-sort="score" style="cursor:pointer">分数${sortIcon('score')}</div><div class="th-subdim">子维度</div><div class="th-sortable th-comp" data-sort="composite" style="cursor:pointer">${dimCountLabel()}${sortIcon('composite')}</div>`
    + `<div class="th-base" data-tooltip="综合分与所选基准模型的差值，锚点来自 config.baseline">${showBaselineCol ? 'vs 基准' : ''}</div>`
    + `<div class="th-sortable th-cost" data-sort="cost" style="cursor:pointer">成本${sortIcon('cost')}</div><div class="th-compare">对比</div><div class="th-expand"></div>`;

  let body = `<div class="ranking-table${showBaselineCol ? '' : ' no-baseline'}"><div class="table-header">${headerCells}</div>`;
  body += refSplit.main.map(renderRow).join('');
  body += '</div>';

  if (refSplit.refs.length > 0) {
    body += `<div class="ref-block">
      <div class="ref-block-title">参照模型 · 不在九家范围（${refSplit.refs.length} 个）
        <span class="ref-block-sub">同一 benchmark 分数，仅用于对照，不占综合名次</span>
      </div>
      <div class="ranking-table ref-table${showBaselineCol ? '' : ' no-baseline'}"><div class="table-header">${headerCells}</div>${refSplit.refs.map(renderRow).join('')}</div>
    </div>`;
  }

  html += body;
  main.innerHTML = html;

  bindRankingControls(benchKey);

  // Bind row events
  main.querySelectorAll('.table-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.action-btn')) return;
      const modelId = row.dataset.model;
      const reasoning = row.dataset.reasoning;
      const expKey = modelId + '|' + reasoning;
      state.expandedModel = state.expandedModel === expKey ? null : expKey;
      renderRankingView();
    });
  });

  // Bind action buttons
  main.querySelectorAll('[data-action="compare"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleCompare(btn.dataset.model);
      renderRankingView();
    });
  });

  // Bind sort headers
  main.querySelectorAll('.th-sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (state.rankingSort.key === key) state.rankingSort.desc = !state.rankingSort.desc;
      else { state.rankingSort.key = key; state.rankingSort.desc = true; }
      renderRankingView();
    });
  });

  // Initialize radar chart if expanded
  if (state.expandedModel) {
    const [modelId] = state.expandedModel.split('|');
    renderRadar(modelId);
    // Bind dimension card clicks
    bindDrilldownEvents();
  }
}

// 按 in_scope 拆分榜单行（保持既有排序）
function splitReference(items) {
  const main = [], refs = [];
  items.forEach(it => { (isInScope(it.model_id) ? main : refs).push(it); });
  return { main, refs };
}

// 维度数中文标签（5 → 五维），避免写死「五维」
function dimCountLabel() {
  const cn = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  const n = DIMENSIONS.length;
  return (cn[n] || n) + '维';
}

// 基准选择器 + 参照模型开关 + 出处徽标 tooltip
function bindRankingControls(benchKey) {
  const sel = document.getElementById('baseline-select');
  if (sel) {
    sel.addEventListener('change', () => {
      state.baseline = sel.value;
      invalidateCache();
      renderRankingView();
    });
  }
  const toggle = document.getElementById('toggle-reference');
  if (toggle) {
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      state.includeReference = !state.includeReference;
      invalidateCache();
      renderRankingView();
    });
  }
  const main = document.getElementById('main');
  main.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', showTooltip);
    el.addEventListener('mouseleave', hideTooltip);
  });
}

function renderDrilldownHTML(item, benchKey) {
  const modelId = item.model_id;
  const model = getModel(modelId);
  if (!model) return '';

  // Left column
  const benchMeta = (DATA.benchmark_meta || {})[benchKey] || {};
  let left = '<div class="drill-left"><div class="drill-left-title">当前评测' + (benchLabel(benchKey) ? ' · ' + benchLabel(benchKey) : '') + '</div>';
  left += `<div class="drill-left-stat"><span class="drill-left-label">分数</span><span class="drill-left-value">${isCostBench(benchKey) ? formatCost(item.score_raw) : formatScore(item.score_raw)}</span></div>`;
  left += `<div class="drill-left-stat"><span class="drill-left-label">排名</span><span class="drill-left-value">No.${item.rank}</span></div>`;
  if (item.input_tokens != null) left += `<div class="drill-left-stat"><span class="drill-left-label">输入 tokens</span><span class="drill-left-value">${formatTokens(item.input_tokens)}</span></div>`;
  if (item.output_tokens != null) left += `<div class="drill-left-stat"><span class="drill-left-label">输出 tokens</span><span class="drill-left-value">${formatTokens(item.output_tokens)}</span></div>`;
  if (item.reasoning_tokens != null) left += `<div class="drill-left-stat"><span class="drill-left-label">推理 tokens</span><span class="drill-left-value">${formatTokens(item.reasoning_tokens)}</span></div>`;
  if (item.run_cost_usd != null) left += `<div class="drill-left-stat"><span class="drill-left-label">本轮消耗</span><span class="drill-left-value">${formatCost(item.run_cost_usd)}</span></div>`;
  else if (item.cost_usd != null) left += `<div class="drill-left-stat"><span class="drill-left-label">成本</span><span class="drill-left-value">${formatCost(item.cost_usd)}</span></div>`;
  if (item.source) left += `<div class="drill-left-stat"><span class="drill-left-label">来源</span><span class="drill-left-value">${item.source}</span></div>`;
  // 出处：本条数值的快照日 + 原始链接 + 数据源状态
  const entryUrl = item.source_url || benchMeta.source_url;
  left += `<div class="drill-left-stat"><span class="drill-left-label">AA 快照</span><span class="drill-left-value">${entryDate(item) || '—'}${benchStatusBadge(benchKey, 'inline')}</span></div>`;
  if (entryUrl) left += `<div class="drill-left-stat"><span class="drill-left-label">数据来源</span><span class="drill-left-value"><a class="src-link" href="${entryUrl}" target="_blank" rel="noopener">查看原始页面</a></span></div>`;
  if (item.confidence != null) left += `<div class="drill-left-stat"><span class="drill-left-label">置信度</span><span class="drill-left-value">${(item.confidence * 100).toFixed(0)}%</span></div>`;
  // Breakdown details
  if (item.breakdown && typeof item.breakdown === 'object') {
    const bd = item.breakdown;
    if (bd.total && typeof bd.total === 'object') {
      if (bd.total.accuracy != null) left += `<div class="drill-left-stat"><span class="drill-left-label">总准确率</span><span class="drill-left-value">${(bd.total.accuracy * 100).toFixed(1)}%</span></div>`;
      if (bd.total.omniscience != null) left += `<div class="drill-left-stat"><span class="drill-left-label">Omniscience</span><span class="drill-left-value">${bd.total.omniscience.toFixed(1)}</span></div>`;
    }
    if (bd.accuracy != null) left += `<div class="drill-left-stat"><span class="drill-left-label">准确率</span><span class="drill-left-value">${(bd.accuracy * 100).toFixed(1)}%</span></div>`;
    if (bd.hallucinationRate != null) left += `<div class="drill-left-stat"><span class="drill-left-label">幻觉率</span><span class="drill-left-value">${(bd.hallucinationRate * 100).toFixed(1)}%</span></div>`;
    if (bd.attemptRate != null) left += `<div class="drill-left-stat"><span class="drill-left-label">作答率</span><span class="drill-left-value">${(bd.attemptRate * 100).toFixed(1)}%</span></div>`;
    if (bd.criteriaPass != null) left += `<div class="drill-left-stat"><span class="drill-left-label">通过率</span><span class="drill-left-value">${(bd.criteriaPass * 100).toFixed(1)}%</span></div>`;
    const pin = bd.pricing_input != null ? bd.pricing_input : bd.input_per_1m;
    const pout = bd.pricing_output != null ? bd.pricing_output : bd.output_per_1m;
    if (pin != null) left += `<div class="drill-left-stat"><span class="drill-left-label">输入价格</span><span class="drill-left-value">$${pin}/M</span></div>`;
    if (pout != null) left += `<div class="drill-left-stat"><span class="drill-left-label">输出价格</span><span class="drill-left-value">$${pout}/M</span></div>`;
    if (bd.cache_input_per_1m != null) left += `<div class="drill-left-stat"><span class="drill-left-label">缓存输入</span><span class="drill-left-value">$${bd.cache_input_per_1m}/M</span></div>`;
    if (bd.assumption) left += `<div class="drill-left-stat"><span class="drill-left-label">计价假设</span><span class="drill-left-value">${bd.assumption}</span></div>`;
    if (Array.isArray(bd.items)) left += `<div class="drill-left-stat"><span class="drill-left-label">覆盖评测数</span><span class="drill-left-value">${bd.n_benchmarks != null ? bd.n_benchmarks : bd.items.length} 项（取中位）</span></div>`;
  }
  left += '</div>';

  // Middle column - dimension cards (exclude current dimension, 2x2 layout with row interlock)
  const otherDims = DIMENSIONS.filter(dim => dim.key !== state.activeDimension);
  let middle = '<div class="drill-middle"><div class="dim-cards">';
  otherDims.forEach((dim, idx) => {
    const score = getDimensionScore(modelId, dim.key);
    const rank = getDimensionRank(modelId, dim.key);
    const hasData = hasDimensionData(dim.key);
    const cov = getDimensionCoverage(modelId, dim.key);
    const row = idx < 2 ? 1 : 2;  // 第1行 or 第2行
    const isRow1Expanded = state._drillExpandedRow !== 2;  // 默认第1行展开
    const isExpanded = (row === 1 && isRow1Expanded) || (row === 2 && !isRow1Expanded);
    middle += `<div class="dim-card ${isExpanded ? 'expanded' : ''}" data-dim="${dim.key}" data-row="${row}">`;
    middle += `<div class="dim-card-head"><span class="dim-card-name">${dim.name}</span><span class="dim-card-rank">${hasData ? 'No.' + (rank || '—') : '无数据'}</span></div>`;
    middle += `<div class="dim-card-score">${score != null ? score.toFixed(1) : '—'}${dim.key === 'cost' && score === 0 ? '<span class="cost-zero-badge">最贵</span>' : ''}</div>`;
    if (score != null && cov && cov.sources) middle += `<div class="dim-card-cov">覆盖 ${cov.covered}/${cov.sources} 个数据源</div>`;
    middle += `<div class="dim-card-expand">`;
    if (hasData) {
      const benches = getBenchmarksByDimension(dim.key);
      benches.forEach(b => {
        const bRanking = getBenchRanking(b);
        const bItem = bRanking.find(r => r.model_id === modelId);
        const bScore = bItem ? bItem.score_raw : null;
        const bRank = bItem ? bItem.rank : null;
        const bMeta = (DATA.benchmark_meta || {})[b] || {};
        const bUrl = bItem && bItem.source_url ? bItem.source_url : bMeta.source_url;
        const bDate = bItem ? entryDate(bItem) : null;
        const scoreDisplay = isCostBench(b) ? formatCost(bScore) : formatScore(bScore);
        middle += `<div class="dim-sub-item" data-bench="${b}" data-dim="${dim.key}" data-tooltip="${benchTooltip(b).replace(/"/g, '&quot;')}">
          <span class="dim-sub-name">${benchLabel(b)}${bScore == null ? '' : benchStatusBadge(b, 'inline')}</span>
          <span class="dim-sub-meta">
            <span><span class="dim-sub-score">${scoreDisplay}</span> <span class="dim-sub-rank">No.${bRank || '—'}</span></span>
            <span class="dim-sub-src">${bDate ? bDate : '—'}${bUrl && bScore != null ? ' · <a href="' + bUrl + '" target="_blank" rel="noopener">源</a>' : ''}</span>
          </span>
        </div>`;
      });
    } else {
      middle += '<div style="font-size:11px;color:var(--text-tertiary);padding:4px 0">数据待入库</div>';
    }
    middle += `</div>`;
    if (!isExpanded) {
      middle += `<div class="dim-card-hint">点击展开 ↓</div>`;
    }
    middle += `</div>`;
  });
  middle += '</div></div>';

  // Right column
  let right = '<div class="drill-right">';
  right += '<div class="radar-chart" id="radar-chart"></div>';
  const compScore = getCompositeScore(modelId);
  const compRank = getCompositeRankLabel(modelId);
  right += `<div class="composite-box"><div class="composite-score">${compScore != null ? compScore.toFixed(1) : '—'}</div><div class="composite-rank">${compRank ? '综合排名 No.' + compRank : '参照模型 · 不占综合名次'}</div></div>`;
  // Reasoning level comparison
  const reasoningLevels = getReasoningLevels(modelId, benchKey);
  if (reasoningLevels.length > 1) {
    right += '<div class="reasoning-compare"><div class="reasoning-title">推理级别对比</div>';
    reasoningLevels.forEach(r => {
      const scoreDisplay = isCostBench(benchKey) ? formatCost(r.score_raw) : formatScore(r.score_raw);
      right += `<div class="reasoning-item ${r.best ? 'best' : ''}"><span>${r.label}</span><span class="reasoning-val">${scoreDisplay}</span></div>`;
    });
    right += '</div>';
  }
  right += '</div>';

  return `<div class="drilldown-panel open">${left}${middle}${right}</div>`;
}

function bindDrilldownEvents() {
  const main = document.getElementById('main');
  main.querySelectorAll('.dim-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.dim-sub-item')) return;
      const clickedRow = parseInt(card.dataset.row);
      const currentExpandedRow = state._drillExpandedRow || 1;
      if (clickedRow === currentExpandedRow) {
        state._drillExpandedRow = clickedRow === 1 ? 2 : 1;
      } else {
        state._drillExpandedRow = clickedRow;
      }
      const cards = main.querySelectorAll('.dim-card');
      cards.forEach(c => {
        const row = parseInt(c.dataset.row);
        const isExpanded = row === state._drillExpandedRow;
        c.classList.toggle('expanded', isExpanded);
        const hint = c.querySelector('.dim-card-hint');
        if (hint) hint.style.display = isExpanded ? 'none' : 'block';
      });
    });
  });
  main.querySelectorAll('.dim-sub-item').forEach(item => {
    item.addEventListener('click', (e) => {
      if (e.target.closest('.dim-sub-src a')) return; // 点出处链接不切维度
      e.stopPropagation();
      const bench = item.dataset.bench;
      const dim = item.dataset.dim;
      state.activeDimension = dim;
      state.activeBench = bench;
      state.expandedModel = null;
      renderDimensionNav();
      renderCurrentView();
    });
  });
  main.querySelectorAll('.dim-sub-src a, .drill-left-stat a').forEach(a => {
    a.addEventListener('click', e => e.stopPropagation());
  });
  main.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', showTooltip);
    el.addEventListener('mouseleave', hideTooltip);
  });
}

// ===== MATRIX VIEW =====
function renderMatrixView() {
  const main = document.getElementById('main');
  document.getElementById('dimension-nav').style.display = 'none';

  const dimBenches = [];
  DIMENSIONS.forEach(dim => {
    const benches = getBenchmarksByDimension(dim.key);
    if (benches.length > 0) dimBenches.push({ dim, benches });
  });
  const allBenches = dimBenches.flatMap(db => db.benches);

  if (allBenches.length === 0) {
    main.innerHTML = '<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">暂无数据</div></div>';
    return;
  }

  // Get filtered models
  let models = Object.keys(DATA.models).filter(id => {
    const m = getModel(id);
    if (!m) return false;
    if (state.searchQuery) {
      const q = state.searchQuery.toLowerCase();
      if (!(m.display_name || id).toLowerCase().includes(q) && !id.toLowerCase().includes(q)) return false;
    }
    if (state.activeProviders.size > 0 && !state.activeProviders.has(m.provider)) return false;
    return true;
  });

  // Sort models
  if (_matrixSort.key) {
    const benchKey = _matrixSort.key;
    const ranking = getBenchRanking(benchKey);
    models.sort((a, b) => {
      const aItem = ranking.find(r => r.model_id === a);
      const bItem = ranking.find(r => r.model_id === b);
      if (!aItem && !bItem) return 0;
      if (!aItem) return 1;
      if (!bItem) return -1;
      return _matrixSort.desc ? bItem.score_raw - aItem.score_raw : aItem.score_raw - bItem.score_raw;
    });
  } else {
    // 默认排序：in_scope 在前，其次按综合分，无数据的排后面
    models.sort((a, b) => {
      const aRef = !isInScope(a), bRef = !isInScope(b);
      if (aRef !== bRef) return aRef ? 1 : -1;
      const aScore = getCompositeScore(a);
      const bScore = getCompositeScore(b);
      const aHas = aScore != null;
      const bHas = bScore != null;
      if (aHas !== bHas) return aHas ? -1 : 1;
      return (bScore || 0) - (aScore || 0);
    });
  }

  // Column stats for heatmap
  const colStats = {};
  allBenches.forEach(b => {
    const ranking = getBenchRanking(b);
    const scores = ranking.map(r => r.score_raw).filter(s => s != null);
    if (scores.length > 0) colStats[b] = { max: Math.max(...scores), min: Math.min(...scores) };
  });

  let html = '<div class="matrix-view">';
  html += `<div class="view-source-line">矩阵总览：每列一个 benchmark 数据源，${snapshotDate() ? 'AA 快照 ' + snapshotDate() + ' · ' : ''}共 ${allBenches.length} 个数据源 / ${models.length} 个模型（含参照模型，标「参照」者为九家范围外）</div>`;
  html += '<div class="matrix-table"><div class="matrix-grid" style="grid-template-columns: 120px repeat(' + allBenches.length + ', minmax(50px, 1fr));">';

  // Dimension header row
  html += '<div class="matrix-row"><div class="matrix-row-label"></div>';
  dimBenches.forEach(db => {
    html += `<div class="matrix-dim-header" style="grid-column: span ${db.benches.length}" data-tooltip="${db.dim.desc.replace(/"/g, '&quot;')}">${db.dim.name}</div>`;
  });
  html += '</div>';

  // Benchmark header row — 短名自动折行压缩列宽
  html += '<div class="matrix-row"><div class="matrix-row-label">模型</div>';
  allBenches.forEach(b => {
    html += `<div class="matrix-bench-header" data-bench="${b}" data-tooltip="${benchTooltip(b).replace(/"/g, '&quot;')}" style="cursor:pointer">${wrapBenchLabel(benchLabel(b))}${benchStatus(b) ? '<span class="src-badge inline">' + benchStatus(b) + '</span>' : ''}</div>`;
  });
  html += '</div>';

  // Model rows（矩阵总览保留全部模型，参照模型灰显并标注）
  models.forEach(modelId => {
    const model = getModel(modelId);
    const isRef = !isInScope(modelId);
    html += '<div class="matrix-row">';
    html += `<div class="matrix-row-label${isRef ? ' is-reference' : ''}" data-tooltip="${isRef ? '参照 · 不在九家范围' : ''}">${model.display_name || modelId}${isRef ? ' <span class="src-badge inline">参照</span>' : ''}</div>`;
    allBenches.forEach(b => {
      const ranking = getBenchRanking(b);
      const item = ranking.find(r => r.model_id === modelId);
      if (item) {
        const stats = colStats[b];
        let heatPct = 0;
        if (stats) {
          const isCost = isCostBench(b);
          const range = stats.max - stats.min || 1;
          const ratio = isCost ? (stats.max - item.score_raw) / range : (item.score_raw - stats.min) / range;
          heatPct = Math.max(0, Math.min(100, Math.round(ratio * 100)));
        }
        const scoreDisplay = isCostBench(b) ? formatCost(item.score_raw) : formatScore(item.score_raw);
        html += `<div class="matrix-cell heatmap${isRef ? ' is-reference' : ''}" data-model="${modelId}" data-bench="${b}" data-tooltip="${(entryDate(item) ? entryDate(item) + ' · ' : '') + (item.source_url || benchSourceUrl(b))}" style="cursor:pointer;--heat-pct:${heatPct}%">${scoreDisplay}</div>`;
      } else {
        html += `<div class="matrix-cell empty${isRef ? ' is-reference' : ''}" data-model="${modelId}" data-bench="${b}">—</div>`;
      }
    });
    html += '</div>';
  });

  html += '</div></div></div>';
  main.innerHTML = html;

  // 冻结表头：计算第一行高度，设置第二行 top 值
  const dimHeaders = main.querySelectorAll('.matrix-dim-header');
  if (dimHeaders.length > 0) {
    const firstRowHeight = dimHeaders[0].offsetHeight;
    const benchHeaders = main.querySelectorAll('.matrix-bench-header');
    benchHeaders.forEach(header => {
      header.style.top = firstRowHeight + 'px';
    });
    // 第一行的 row-label 也要 sticky
    const firstRowLabel = main.querySelector('.matrix-row:first-child .matrix-row-label');
    if (firstRowLabel) {
      firstRowLabel.style.position = 'sticky';
      firstRowLabel.style.top = '0';
      firstRowLabel.style.zIndex = '3';
    }
    // 第二行的 row-label 也要 sticky
    const secondRowLabel = main.querySelector('.matrix-row:nth-child(2) .matrix-row-label');
    if (secondRowLabel) {
      secondRowLabel.style.position = 'sticky';
      secondRowLabel.style.top = firstRowHeight + 'px';
      secondRowLabel.style.zIndex = '3';
    }
  }

  // Bind tooltip for dimension headers and benchmark headers
  main.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', showTooltip);
    el.addEventListener('mouseleave', hideTooltip);
  });

  // Bind header sort
  main.querySelectorAll('.matrix-bench-header').forEach(header => {
    header.addEventListener('click', () => {
      const bench = header.dataset.bench;
      if (_matrixSort.key === bench) _matrixSort.desc = !_matrixSort.desc;
      else { _matrixSort.key = bench; _matrixSort.desc = true; }
      renderMatrixView();
    });
  });

  // Bind cell click
  main.querySelectorAll('.matrix-cell:not(.empty)').forEach(cell => {
    cell.addEventListener('click', () => {
      const modelId = cell.dataset.model;
      const bench = cell.dataset.bench;
      const dim = DIMENSIONS.find(d => (BENCH_GROUPS[d.key] || []).indexOf(bench) >= 0);
      if (dim) {
        state.activeDimension = dim.key;
        state.activeBench = bench;
      }
      state.view = 'ranking';
      state.expandedModel = modelId + '|';
      document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === 'ranking'));
      document.getElementById('dimension-nav').style.display = '';
      renderDimensionNav();
      renderCurrentView();
    });
  });
}

// ===== COMPARE VIEW =====
function renderCompareView() {
  const main = document.getElementById('main');
  document.getElementById('dimension-nav').style.display = 'none';

  if (state.compareList.length === 0) {
    main.innerHTML = '<div class="empty"><div class="empty-icon">⚖️</div><div class="empty-text">对比列表为空，请在排行榜中点击"对比"按钮添加模型</div></div>';
    return;
  }

  // 使用对比视图专用计算（缺失维度用对比池内最低分填充）
  const modelIds = state.compareList.filter(id => getModel(id));
  const compareScores = getCompareCompositeScore(modelIds);

  // Sort models by compare-specific composite score
  const models = modelIds.map(id => getModel(id)).filter(m => m);
  const sortedModels = models.slice().sort((a, b) => {
    const scoreA = compareScores[a.id]?.score ?? -Infinity;
    const scoreB = compareScores[b.id]?.score ?? -Infinity;
    return scoreB - scoreA;
  });

  // 收集缺失信息用于提示
  const allMissingInfo = [];
  sortedModels.forEach(m => {
    const info = compareScores[m.id];
    if (info && info.missingDims.length > 0) {
      allMissingInfo.push(`${m.display_name} 在 ${info.missingDims.join('、')} 维度无数据`);
    }
  });

  const dimBenches = [];
  DIMENSIONS.forEach(dim => {
    const benches = getBenchmarksByDimension(dim.key);
    if (benches.length > 0) dimBenches.push({ dim, benches });
  });

  // Weight sliders with collapsible sub-dimensions
  let html = '<div class="compare-view">';
  html += '<div class="weight-panel" style="padding:12px 16px;border-bottom:1px solid var(--border)">';
  html += '<div class="weight-panel-header" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none" id="weight-panel-toggle">';
  html += '<div style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary)">权重调整（实时重算）</div>';
  html += '<span class="weight-panel-arrow" style="font-size:12px;color:var(--text-tertiary);transition:transform 0.2s">▼</span>';
  html += '</div>';
  html += '<div class="weight-panel-content" style="margin-top:8px">';
  DIMENSIONS.forEach(dim => {
    const w = Math.round((state.weights[dim.key] || 0) * 100);
    const benches = getBenchmarksByDimension(dim.key);
    const hasSubDims = benches.length > 0;
    const isExpanded = state.expandedWeightDim === dim.key;
    
    html += `<div class="weight-dim-group" data-dim="${dim.key}">`;
    html += `<div class="weight-slider-row" style="cursor:${hasSubDims ? 'pointer' : 'default'}" data-toggle-dim="${hasSubDims ? dim.key : ''}">
      <span class="weight-slider-label">
        ${dim.name}
        <span class="dim-help-icon" data-tooltip="${dim.desc.replace(/"/g, '&quot;')}">?</span>
      </span>
      <input type="range" class="weight-slider" min="0" max="100" value="${w}" data-dim="${dim.key}">
      <span class="weight-slider-value">${w}%</span>
      ${hasSubDims ? `<span class="sub-dim-toggle" data-dim="${dim.key}" style="display:inline-flex;align-items:center;gap:4px;padding:4px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s ease;${isExpanded ? 'background:var(--accent);color:var(--text-inverse)' : 'background:var(--accent-soft);color:var(--accent)'}">${isExpanded ? '收起' : '子维度'}</span>` : ''}
    </div>`;
    
    // Sub-dimension sliders - hidden by default, shown when expanded (accordion)
    if (hasSubDims) {
      html += `<div class="sub-dim-row" data-parent-dim="${dim.key}" style="display:${isExpanded ? 'grid' : 'none'}">`;
      benches.forEach(b => {
        const benchW = state.benchWeights?.[b] ?? (1 / benches.length);
        const benchPct = Math.round(benchW * 100);
        const benchName = benchLabel(b);
        html += `<div class="sub-dim-item">
          <span class="sub-dim-label">${benchName}</span>
          <input type="range" class="sub-dim-slider" min="0" max="100" value="${benchPct}" data-bench="${b}" data-parent-dim="${dim.key}">
          <span class="sub-dim-value">${benchPct}%</span>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });
  html += `<div style="margin-top:8px;font-size:11px;color:var(--text-tertiary)">子维度共同组成该维度的评分体系，可展开调整各子维度权重，获得更符合你需求的排名</div>`;
  html += `<div style="margin-top:8px"><button class="action-btn" id="reset-weights">重置默认权重</button></div>`;
  html += '</div></div>';

  // Compare table with sorted models
  _compareColumns = sortedModels.map(m => m.id);
  html += `<div class="view-source-line">对比口径：${dimBenches.reduce((s, db) => s + db.benches.length, 0)} 个数据源${snapshotDate() ? ' · AA 快照 ' + snapshotDate() : ''} · 缺失维度按对比池内最低分填充</div>`;
  html += '<table class="compare-table"><thead><tr><th>评测</th>';
  sortedModels.forEach((m, idx) => {
    const compScore = compareScores[m.id]?.score;
    const rankLabel = compScore != null ? `<span style="color:var(--accent);font-weight:600">No.${idx + 1}</span>` : '';
    const refBadge = isInScope(m.id) ? '' : '<br><span style="font-size:9px;color:var(--text-tertiary);font-weight:normal">参照 · 不在九家范围</span>';
    const missingBadge = compareScores[m.id]?.missingDims?.length > 0
      ? `<br><span style="font-size:9px;color:var(--text-tertiary);font-weight:normal">⚠ 缺 ${compareScores[m.id].missingDims.length} 维</span>`
      : '';
    html += `<th class="compare-col-header">${rankLabel}<br>${m.display_name}${refBadge}${missingBadge}<br><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);font-weight:normal">${m.id}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  // Benchmark rows grouped by dimension
  dimBenches.forEach(db => {
    html += `<tr><td colspan="${sortedModels.length + 1}" style="background:var(--bg-section);font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--accent)">${db.dim.name}</td></tr>`;
    db.benches.forEach(b => {
      const values = sortedModels.map(m => {
        const ranking = getBenchRanking(b);
        const item = ranking.find(r => r.model_id === m.id);
        return item ? item.score_raw : null;
      });
      const isCost = isCostBench(b);
      const validVals = values.filter(v => v != null);
      let bestIdx = -1;
      if (validVals.length > 0) {
        const best = isCost ? Math.min(...validVals) : Math.max(...validVals);
        bestIdx = values.indexOf(best);
      }
      // Add tooltip for benchmark description
      const meta = DATA.benchmark_meta[b] || {};
      const tooltipText = benchTooltip(b) + (meta.source ? ' · 来源 ' + meta.source : '') + (snapshotDate() ? ' · AA 快照 ' + snapshotDate() : '');
      html += `<tr data-bench="${b}"><td class="compare-row-label" data-tooltip="${tooltipText.replace(/"/g, '&quot;')}">${benchLabel(b)}${benchStatus(b) ? '<span class="src-badge inline">' + benchStatus(b) + '</span>' : ''}</td>`;
      values.forEach((v, i) => {
        const scoreDisplay = v == null ? '<span class="compare-empty">—</span>' : (isCost ? formatCost(v) : formatScore(v));
        const bestClass = i === bestIdx ? ' compare-best' : '';
        html += `<td class="compare-cell${bestClass}">${scoreDisplay}</td>`;
      });
      html += '</tr>';
    });
  });

  // Composite score row
  html += `<tr data-role="composite"><td class="compare-row-label" style="font-weight:600;color:var(--accent)">综合指数</td>`;
  const compScores = sortedModels.map(m => compareScores[m.id]?.score);
  const validComp = compScores.filter(s => s != null);
  let bestComp = -1;
  if (validComp.length > 0) {
    const best = Math.max(...validComp);
    bestComp = compScores.indexOf(best);
  }
  compScores.forEach((s, i) => {
    const display = s != null ? s.toFixed(1) : '<span class="compare-empty">—</span>';
    const bestClass = i === bestComp ? ' compare-best' : '';
    html += `<td class="compare-cell${bestClass}" style="font-size:16px;font-weight:600">${display}</td>`;
  });
  html += '</tr>';

  html += '</tbody></table>';

  // 缺失数据提示
  if (allMissingInfo.length > 0) {
    html += `<div style="margin-top:12px;padding:12px 16px;background:var(--bg-section);border-radius:8px;font-size:12px;color:var(--text-secondary);line-height:1.6">`;
    html += `<div style="font-weight:600;margin-bottom:6px">⚠ 数据缺失说明</div>`;
    html += `<div>${allMissingInfo.join('；')}。</div>`;
    html += `<div style="margin-top:6px;color:var(--text-tertiary)">缺失维度已按对比池内最低分参照计算，排名仅供参考，请更关注您所重视的维度。</div>`;
    html += `</div>`;
  }

  html += '</div>';
  main.innerHTML = html;

  // Bind weight panel toggle
  const toggleBtn = document.getElementById('weight-panel-toggle');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      const content = main.querySelector('.weight-panel-content');
      const arrow = main.querySelector('.weight-panel-arrow');
      if (content.style.display === 'none') {
        content.style.display = '';
        arrow.style.transform = 'rotate(0deg)';
      } else {
        content.style.display = 'none';
        arrow.style.transform = 'rotate(-90deg)';
      }
    });
  }

  // Bind sub-dimension toggle: click entire row or the ▶ button to expand/collapse
  const toggleWeightDim = (dimKey) => {
    if (state.expandedWeightDim === dimKey) {
      state.expandedWeightDim = null;
    } else {
      state.expandedWeightDim = dimKey;
    }
    renderCompareView();
  };

  // Click on the toggle button (▶/▼)
  main.querySelectorAll('.sub-dim-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleWeightDim(btn.dataset.dim);
    });
  });

  // Click on the entire row (but not on slider or ? icon)
  main.querySelectorAll('.weight-slider-row[data-toggle-dim]').forEach(row => {
    row.addEventListener('click', (e) => {
      // 不拦截滑块拖动和问号 tooltip
      if (e.target.tagName === 'INPUT' || e.target.classList.contains('dim-help-icon')) return;
      const dimKey = row.dataset.toggleDim;
      if (dimKey) toggleWeightDim(dimKey);
    });
  });

  // Bind weight sliders - 拖动时其他不动，松开时按比例分配
  main.querySelectorAll('.weight-slider').forEach(slider => {
    // 拖动时只更新当前滑块显示，不重建DOM
    slider.addEventListener('input', () => {
      const row = slider.closest('.weight-slider-row');
      row.querySelector('.weight-slider-value').textContent = slider.value + '%';
      // 更新权重状态，但不重建DOM
      const dim = slider.dataset.dim;
      state.weights[dim] = parseInt(slider.value) / 100;
      invalidateCache();
      // 只更新表格内容，不重建权重面板
      updateCompareTableOnly();
    });

    // 松开鼠标时，按比例分配剩余值给其他维度
    slider.addEventListener('change', () => {
      const dim = slider.dataset.dim;
      const val = parseInt(slider.value) / 100;

      // 计算其他维度的当前权重
      const otherDims = DIMENSIONS.filter(d => d.key !== dim);
      const otherWeights = otherDims.map(d => state.weights[d.key] || 0);
      const otherSum = otherWeights.reduce((a, b) => a + b, 0);
      const remaining = 1 - val;

      // 设置当前维度
      state.weights[dim] = val;

      // 按比例分配剩余值给其他维度
      if (otherSum > 0) {
        otherDims.forEach(d => {
          state.weights[d.key] = (state.weights[d.key] / otherSum) * remaining;
        });
      } else {
        // 如果其他维度都是 0，平均分配
        const avg = remaining / otherDims.length;
        otherDims.forEach(d => {
          state.weights[d.key] = avg;
        });
      }

      // 更新所有滑块的显示
      main.querySelectorAll('.weight-slider').forEach(s => {
        const d = s.dataset.dim;
        const v = Math.round((state.weights[d] || 0) * 100);
        s.value = v;
        s.closest('.weight-slider-row').querySelector('.weight-slider-value').textContent = v + '%';
      });

      invalidateCache();
      renderCompareView();
    });
  });

  // Bind sub-dimension sliders
  main.querySelectorAll('.sub-dim-slider').forEach(slider => {
    slider.addEventListener('input', () => {
      const bench = slider.dataset.bench;
      const parentDim = slider.dataset.parentDim;
      const val = parseInt(slider.value) / 100;

      // 初始化 benchWeights
      if (!state.benchWeights) state.benchWeights = {};

      // 获取同一维度下的所有 benchmark
      const benches = getBenchmarksByDimension(parentDim);
      const currentSlider = slider;
      const otherSliders = Array.from(main.querySelectorAll(`.sub-dim-slider[data-parent-dim="${parentDim}"]`))
        .filter(s => s !== currentSlider);

      // 计算其他滑块的当前值
      const otherValues = otherSliders.map(s => parseInt(s.value) / 100);
      const otherSum = otherValues.reduce((a, b) => a + b, 0);
      const remaining = 1 - val;

      // 设置当前 benchmark 的权重
      state.benchWeights[bench] = val;

      // 按比例分配剩余值给其他 benchmark
      if (otherSum > 0) {
        otherSliders.forEach((s, i) => {
          const otherBench = s.dataset.bench;
          const newVal = (otherValues[i] / otherSum) * remaining;
          state.benchWeights[otherBench] = newVal;
        });
      } else {
        // 如果其他都是 0，平均分配
        const avg = remaining / otherSliders.length;
        otherSliders.forEach(s => {
          const otherBench = s.dataset.bench;
          state.benchWeights[otherBench] = avg;
        });
      }

      // 更新所有子维度滑块的显示
      otherSliders.forEach(s => {
        const otherBench = s.dataset.bench;
        const v = Math.round((state.benchWeights[otherBench] || 0) * 100);
        s.value = v;
        s.closest('.sub-dim-item').querySelector('.sub-dim-value').textContent = v + '%';
      });

      // 更新当前滑块显示
      slider.closest('.sub-dim-item').querySelector('.sub-dim-value').textContent = Math.round(val * 100) + '%';

      invalidateCache();
      updateCompareTableOnly();
    });

    // 松手后重建（列顺序、缺失说明按新权重重排）
    slider.addEventListener('change', () => {
      invalidateCache();
      renderCompareView();
    });
  });

  // Reset weights
  const resetBtn = document.getElementById('reset-weights');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      state.weights = defaultWeights();
      state.activeScheme = null;
      invalidateCache();
      renderCompareView();
    });
  }

  // Bind benchmark tooltips
  main.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', showTooltip);
    el.addEventListener('mouseleave', hideTooltip);
  });
}

// Tooltip functions
function showTooltip(e) {
  const text = e.target.dataset.tooltip;
  if (!text) return;
  let tooltip = document.getElementById('global-tooltip');
  if (!tooltip) {
    tooltip = document.createElement('div');
    tooltip.id = 'global-tooltip';
    tooltip.style.cssText = 'position:fixed;background:rgba(30,30,30,0.98);color:#fff;padding:16px 20px;border-radius:8px;font-size:13px;line-height:1.6;max-width:400px;box-shadow:0 8px 24px rgba(0,0,0,0.4);pointer-events:none;z-index:9999;opacity:0;transition:opacity 0.15s;border:1px solid rgba(255,255,255,0.1)';
    document.body.appendChild(tooltip);
  }
  tooltip.textContent = text;
  tooltip.style.opacity = '1';
  const rect = e.target.getBoundingClientRect();
  const tooltipRect = tooltip.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 12;
  // Prevent overflow right
  if (left + tooltipRect.width > window.innerWidth - 20) {
    left = window.innerWidth - tooltipRect.width - 20;
  }
  // Prevent overflow bottom
  if (top + tooltipRect.height > window.innerHeight - 20) {
    top = rect.top - tooltipRect.height - 12;
  }
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function hideTooltip() {
  const tooltip = document.getElementById('global-tooltip');
  if (tooltip) tooltip.style.opacity = '0';
}

// ===== SCHEMES VIEW =====
function renderSchemesView() {
  const main = document.getElementById('main');
  document.getElementById('dimension-nav').style.display = 'none';

  let html = '<div class="schemes-view">';
  html += '<div class="schemes-toolbar"><div class="schemes-title">我的权重方案</div>';
  html += '<button class="action-btn" id="new-scheme-btn" style="padding:6px 14px;font-size:12px">+ 新建方案</button></div>';

  if (state.schemes.length === 0) {
    html += '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">暂无保存的方案，点击"新建方案"创建</div></div>';
  } else {
    html += '<div class="scheme-list">';
    state.schemes.forEach(scheme => {
      const isActive = state.activeScheme === scheme.id;
      const isEditing = state.editingSchemeId === scheme.id;
      html += `<div class="scheme-card ${isEditing ? 'editing' : ''}" data-id="${scheme.id}">`;
      html += '<div class="scheme-head">';
      html += `<div class="scheme-name">${scheme.name}${isActive ? ' ✓ 当前应用' : ''}</div>`;
      html += '<div class="scheme-actions">';
      html += `<button class="action-btn ${isActive ? 'active' : ''}" data-action="apply" data-id="${scheme.id}">应用</button>`;
      html += `<button class="action-btn" data-action="edit" data-id="${scheme.id}">编辑</button>`;
      html += `<button class="action-btn" data-action="delete" data-id="${scheme.id}">删除</button>`;
      html += '</div></div>';
      // Weight bars
      html += '<div class="scheme-weights">';
      DIMENSIONS.forEach(dim => {
        const w = (scheme.weights[dim.key] || 0) * 100;
        html += `<div class="weight-item">
          <div class="weight-item-head">
            <span class="weight-item-label">${dim.name}<span class="dim-help-icon" data-tooltip="${dim.desc.replace(/"/g, '&quot;')}">?</span></span>
            <span class="weight-item-value">${w.toFixed(0)}%</span>
          </div>
          <div class="weight-bar"><div class="weight-bar-fill" style="width:${w}%"></div></div>
        </div>`;
      });
      html += '</div>';
      // Editor
      html += '<div class="scheme-editor">';
      html += `<input type="text" class="search-input" style="width:100%;margin-bottom:8px" value="${scheme.name}" data-field="name" placeholder="方案名称">`;
      DIMENSIONS.forEach(dim => {
        const w = Math.round((scheme.weights[dim.key] || 0) * 100);
        const benches = getBenchmarksByDimension(dim.key);
        const hasSubDims = benches.length > 0;
        const isExpanded = state.expandedWeightDim === dim.key;
        html += `<div class="weight-dim-group" data-dim="${dim.key}">`;
        html += `<div class="weight-slider-row" style="cursor:${hasSubDims ? 'pointer' : 'default'}" data-toggle-dim="${hasSubDims ? dim.key : ''}" data-scheme-id="${scheme.id}">
          <span class="weight-slider-label">${dim.name}<span class="dim-help-icon" data-tooltip="${dim.desc.replace(/"/g, '&quot;')}">?</span></span>
          <input type="range" class="weight-slider" min="0" max="100" value="${w}" data-dim="${dim.key}" data-id="${scheme.id}">
          <span class="weight-slider-value">${w}%</span>
          ${hasSubDims ? `<span class="sub-dim-toggle" data-dim="${dim.key}" style="display:inline-flex;align-items:center;gap:4px;padding:4px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s ease;${isExpanded ? 'background:var(--accent);color:var(--text-inverse)' : 'background:var(--accent-soft);color:var(--accent)'}">${isExpanded ? '收起' : '子维度'}</span>` : ''}
        </div>`;
        // Sub-dimension sliders - hidden by default, shown when expanded (accordion)
        if (hasSubDims) {
          html += `<div class="sub-dim-row" data-parent-dim="${dim.key}" data-scheme-id="${scheme.id}" style="display:${isExpanded ? 'grid' : 'none'}">`;
          benches.forEach(b => {
            const benchW = scheme.benchWeights?.[b] ?? (1 / benches.length);
            const benchPct = Math.round(benchW * 100);
            const benchName = benchLabel(b);
            html += `<div class="sub-dim-item">
              <span class="sub-dim-label">${benchName}</span>
              <input type="range" class="sub-dim-slider" min="0" max="100" value="${benchPct}" data-bench="${b}" data-parent-dim="${dim.key}" data-scheme-id="${scheme.id}">
              <span class="sub-dim-value">${benchPct}%</span>
            </div>`;
          });
          html += '</div>';
        }
        html += '</div>';
      });
      html += `<div style="font-size:11px;color:var(--text-tertiary);margin-top:4px" data-role="sum">总和: ${DIMENSIONS.reduce((s, d) => s + (scheme.weights[d.key] || 0) * 100, 0).toFixed(0)}%</div>`;
      html += `<div style="font-size:11px;color:var(--text-tertiary);margin-top:4px">子维度共同组成该维度的评分体系，可展开调整各子维度权重，获得更符合你需求的排名</div>`;
      html += '<div class="scheme-editor-actions">';
      html += `<button class="action-btn" data-action="save" data-id="${scheme.id}" style="background:var(--accent);color:var(--text-inverse);border-color:var(--accent)">保存</button>`;
      html += `<button class="action-btn" data-action="cancel" data-id="${scheme.id}">取消</button>`;
      html += '</div></div></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  main.innerHTML = html;

  // Bind events
  main.querySelectorAll('[data-action="apply"]').forEach(btn => {
    btn.addEventListener('click', () => applyScheme(btn.dataset.id));
  });
  main.querySelectorAll('[data-action="edit"]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.editingSchemeId = btn.dataset.id;
      renderSchemesView();
    });
  });
  main.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.editingSchemeId === btn.dataset.id) state.editingSchemeId = null;
      deleteScheme(btn.dataset.id);
    });
  });
  main.querySelectorAll('[data-action="save"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.scheme-card');
      const id = btn.dataset.id;
      const scheme = state.schemes.find(s => s.id === id);
      if (!scheme) return;
      const nameInput = card.querySelector('[data-field="name"]');
      scheme.name = nameInput.value || '未命名方案';
      card.querySelectorAll('.weight-slider').forEach(slider => {
        scheme.weights[slider.dataset.dim] = parseInt(slider.value) / 100;
      });
      // Normalize weights
      const sum = DIMENSIONS.reduce((s, d) => s + (scheme.weights[d.key] || 0), 0);
      if (sum > 0) DIMENSIONS.forEach(d => { scheme.weights[d.key] = (scheme.weights[d.key] || 0) / sum; });
      saveSchemes();
      state.editingSchemeId = null;
      renderSchemesView();
    });
  });
  main.querySelectorAll('[data-action="cancel"]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.editingSchemeId = null;
      renderSchemesView();
    });
  });

  // Weight slider - proportional redistribution (same as compare view)
  main.querySelectorAll('.scheme-editor .weight-slider').forEach(slider => {
    slider.addEventListener('input', () => {
      // Only update current display during drag, don't move others
      slider.closest('.weight-slider-row').querySelector('.weight-slider-value').textContent = slider.value + '%';
    });

    // On release: redistribute proportionally and save
    slider.addEventListener('change', () => {
      const dim = slider.dataset.dim;
      const schemeId = slider.dataset.id;
      const val = parseInt(slider.value) / 100;
      const card = slider.closest('.scheme-card');
      const scheme = state.schemes.find(s => s.id === schemeId);
      if (!scheme) return;

      // Set current dimension
      scheme.weights[dim] = val;

      // Proportionally redistribute to siblings
      const otherSliders = Array.from(card.querySelectorAll('.scheme-editor .weight-slider'))
        .filter(s => s !== slider);
      const otherDims = otherSliders.map(s => s.dataset.dim);
      const otherValues = otherDims.map(d => scheme.weights[d] || 0);
      const otherSum = otherValues.reduce((a, b) => a + b, 0);
      const remaining = 1 - val;

      if (otherSum > 0) {
        otherDims.forEach((d, i) => {
          scheme.weights[d] = (otherValues[i] / otherSum) * remaining;
        });
      } else {
        const avg = remaining / otherDims.length;
        otherDims.forEach(d => {
          scheme.weights[d] = avg;
        });
      }

      saveSchemes();
      renderSchemesView();
    });
  });

  // Sub-dimension sliders for schemes
  main.querySelectorAll('.scheme-editor .sub-dim-slider').forEach(slider => {
    slider.addEventListener('input', () => {
      const bench = slider.dataset.bench;
      const parentDim = slider.dataset.parentDim;
      const schemeId = slider.dataset.schemeId;
      const val = parseInt(slider.value) / 100;

      // Get the scheme
      const scheme = state.schemes.find(s => s.id === schemeId);
      if (!scheme) return;

      // Initialize benchWeights for this scheme
      if (!scheme.benchWeights) scheme.benchWeights = {};

      // Get sibling sliders
      const card = slider.closest('.scheme-card');
      const siblingSliders = Array.from(card.querySelectorAll(`.sub-dim-slider[data-parent-dim="${parentDim}"]`))
        .filter(s => s !== slider);

      // Calculate other values
      const otherValues = siblingSliders.map(s => parseInt(s.value) / 100);
      const otherSum = otherValues.reduce((a, b) => a + b, 0);
      const remaining = 1 - val;

      // Set current bench weight
      scheme.benchWeights[bench] = val;

      // Distribute remaining to siblings proportionally
      if (otherSum > 0) {
        siblingSliders.forEach((s, i) => {
          const otherBench = s.dataset.bench;
          const newVal = (otherValues[i] / otherSum) * remaining;
          scheme.benchWeights[otherBench] = newVal;
        });
      } else {
        const avg = remaining / siblingSliders.length;
        siblingSliders.forEach(s => {
          const otherBench = s.dataset.bench;
          scheme.benchWeights[otherBench] = avg;
        });
      }

      // Update all sibling displays
      siblingSliders.forEach(s => {
        const otherBench = s.dataset.bench;
        const v = Math.round((scheme.benchWeights[otherBench] || 0) * 100);
        s.value = v;
        s.closest('.sub-dim-item').querySelector('.sub-dim-value').textContent = v + '%';
      });

      // Update current slider display
      slider.closest('.sub-dim-item').querySelector('.sub-dim-value').textContent = Math.round(val * 100) + '%';
    });
  });

  // Sub-dimension toggle (accordion) for scheme view
  const toggleSchemeDim = (dimKey) => {
    if (state.expandedWeightDim === dimKey) {
      state.expandedWeightDim = null;
    } else {
      state.expandedWeightDim = dimKey;
    }
    renderSchemesView();
  };
  main.querySelectorAll('.scheme-editor .sub-dim-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSchemeDim(btn.dataset.dim);
    });
  });
  main.querySelectorAll('.scheme-editor .weight-slider-row[data-toggle-dim]').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.classList.contains('dim-help-icon')) return;
      const dimKey = row.dataset.toggleDim;
      if (dimKey) toggleSchemeDim(dimKey);
    });
  });

  // New scheme button
  const newBtn = document.getElementById('new-scheme-btn');
  if (newBtn) {
    newBtn.addEventListener('click', () => {
      const name = '方案 ' + (state.schemes.length + 1);
      const weights = { ...state.weights };
      const benchWeights = { ...state.benchWeights };
      createScheme(name, weights, benchWeights);
      state.editingSchemeId = state.schemes[state.schemes.length - 1].id;
      renderSchemesView();
    });
  }

  // Bind tooltips for scheme view
  main.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', showTooltip);
    el.addEventListener('mouseleave', hideTooltip);
  });
}

// ===== FILTERS =====
function renderProviderChips() {
  const container = document.getElementById('provider-chips');
  if (!DATA || !DATA.models) return;
  const providers = new Set();
  Object.values(DATA.models).forEach(m => { if (m.provider) providers.add(m.provider); });
  const sorted = [...providers].sort();
  container.innerHTML = sorted.map(p => {
    const meta = PROVIDER_META[p] || { display: p };
    return `<button class="chip ${state.activeProviders.has(p) ? 'active' : ''}" data-provider="${p}">${meta.display}</button>`;
  }).join('');
  container.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.provider;
      if (state.activeProviders.has(p)) state.activeProviders.delete(p);
      else state.activeProviders.add(p);
      renderProviderChips();
      renderCurrentView();
    });
  });
}

function renderAdvFilter() {
  const dropdown = document.getElementById('adv-filter-dropdown');
  const groups = [
    { key: 'rankRange', label: '排名范围', options: [['all', '全部'], ['top10', 'TOP 10'], ['top50', 'TOP 50'], ['top100', 'TOP 100']] },
    { key: 'openSource', label: '开源状态', options: [['all', '全部'], ['Open', '开源'], ['Proprietary', '闭源'], ['Hybrid', '混合']] },
    { key: 'multimodal', label: '多模态', options: [['all', '全部'], ['vision', '视觉'], ['audio', '音频'], ['both', '视觉+音频']] },
    { key: 'reasoningLevel', label: '推理能力', options: [['all', '全部'], ['reasoning', '推理模型'], ['non-reasoning', '非推理']] }
  ];
  dropdown.innerHTML = groups.map(g => `
    <div class="adv-filter-group">
      <div class="adv-filter-label">${g.label}</div>
      <div class="adv-filter-options">
        ${g.options.map(opt => `<button class="chip ${state.advFilters[g.key] === opt[0] ? 'active' : ''}" data-filter="${g.key}" data-value="${opt[0]}">${opt[1]}</button>`).join('')}
      </div>
    </div>
  `).join('');
  dropdown.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      state.advFilters[btn.dataset.filter] = btn.dataset.value;
      renderAdvFilter();
      renderCurrentView();
    });
  });
}

function applyFilters(item) {
  const model = getModel(item.model_id);
  if (!model) return false;
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    const name = (item.display_name || model.display_name || item.model_id).toLowerCase();
    if (!name.includes(q) && !item.model_id.toLowerCase().includes(q)) return false;
  }
  if (state.activeProviders.size > 0 && !state.activeProviders.has(model.provider)) return false;
  if (state.advFilters.rankRange !== 'all') {
    const limit = state.advFilters.rankRange === 'top10' ? 10 : state.advFilters.rankRange === 'top50' ? 50 : 100;
    if (item.rank > limit) return false;
  }
  if (state.advFilters.openSource !== 'all' && model.open_source !== state.advFilters.openSource) return false;
  if (state.advFilters.multimodal !== 'all') {
    if (state.advFilters.multimodal === 'vision' && !model.supports_vision) return false;
    if (state.advFilters.multimodal === 'audio' && !model.supports_audio) return false;
    if (state.advFilters.multimodal === 'both' && (!model.supports_vision || !model.supports_audio)) return false;
  }
  if (state.advFilters.reasoningLevel !== 'all') {
    if (state.advFilters.reasoningLevel === 'reasoning' && !model.is_reasoning) return false;
    if (state.advFilters.reasoningLevel === 'non-reasoning' && model.is_reasoning) return false;
  }
  return true;
}

// ===== RADAR CHART =====
function renderRadar(modelId) {
  const container = document.getElementById('radar-chart');
  if (!container) return;
  // echarts 走 CDN：离线/被墙时降级为文字版维度条，不让整个钻取面板报错
  if (typeof echarts === 'undefined' || !echarts || typeof echarts.init !== 'function') {
    if (radarChart) { radarChart.dispose(); radarChart = null; }
    container.innerHTML = '<div class="radar-fallback">' + DIMENSIONS.map(dim => {
      const score = getDimensionScore(modelId, dim.key);
      const pct = score != null ? Math.max(0, Math.min(100, score)) : 0;
      return `<div class="radar-fallback-row"><span>${dim.name}</span>
        <span class="radar-fallback-bar"><span style="width:${pct}%"></span></span>
        <span class="mono">${score != null ? score.toFixed(1) : '—'}</span></div>`;
    }).join('') + '<div class="radar-fallback-note">雷达图需加载 echarts CDN，当前不可用</div></div>';
    return;
  }
  if (radarChart) radarChart.dispose();
  radarChart = echarts.init(container);

  const values = DIMENSIONS.map(dim => {
    const score = getDimensionScore(modelId, dim.key);
    return score != null ? Math.round(score) : 0;
  });

  const accent = getThemeColor('--accent') || '#0071e3';
  const textSec = getThemeColor('--text-secondary') || '#6e6e73';
  const border = getThemeColor('--border') || 'rgba(0,0,0,.08)';

  radarChart.setOption({
    radar: {
      indicator: DIMENSIONS.map(dim => ({ name: dim.name, max: 100 })),
      shape: 'polygon', splitNumber: 4, radius: '65%',
      axisName: { color: textSec, fontSize: 10 },
      splitLine: { lineStyle: { color: border } },
      splitArea: { areaStyle: { color: ['transparent'] } },
      axisLine: { lineStyle: { color: border } }
    },
    series: [{
      type: 'radar',
      data: [{
        value: values,
        areaStyle: { color: accent + '33' },
        lineStyle: { color: accent, width: 2 },
        itemStyle: { color: accent }
      }]
    }]
  });
}

// ===== SCHEMES MANAGEMENT =====
function loadSchemes() {
  try {
    const raw = localStorage.getItem('llm-index-schemes');
    state.schemes = raw ? JSON.parse(raw) : [];
  } catch (e) { state.schemes = []; }
}

function saveSchemes() {
  try { localStorage.setItem('llm-index-schemes', JSON.stringify(state.schemes)); } catch (e) {}
}

function applyScheme(schemeId) {
  const scheme = state.schemes.find(s => s.id === schemeId);
  if (!scheme) return;
  state.weights = { ...scheme.weights };
  state.benchWeights = scheme.benchWeights ? { ...scheme.benchWeights } : {};
  state.activeScheme = schemeId;
  invalidateCache();
  renderSchemesView();
}

function deleteScheme(schemeId) {
  state.schemes = state.schemes.filter(s => s.id !== schemeId);
  if (state.activeScheme === schemeId) state.activeScheme = null;
  saveSchemes();
  renderSchemesView();
}

function createScheme(name, weights, benchWeights) {
  const scheme = { id: 'scheme_' + Date.now(), name, weights: { ...weights }, benchWeights: benchWeights ? { ...benchWeights } : {} };
  state.schemes.push(scheme);
  saveSchemes();
}

// ===== COMPARE MANAGEMENT =====
function toggleCompare(modelId) {
  const idx = state.compareList.indexOf(modelId);
  if (idx >= 0) state.compareList.splice(idx, 1);
  else state.compareList.push(modelId);
  updateCompareCount();
}

function updateCompareCount() {
  const el = document.getElementById('compare-count');
  if (state.compareList.length > 0) {
    el.textContent = state.compareList.length;
    el.style.display = '';
  } else {
    el.style.display = 'none';
  }
}

function clearCompare() {
  state.compareList = [];
  updateCompareCount();
  renderCurrentView();
}

// 权重滑块拖动中：只改写表格里的数值与高亮，不重建权重面板（列顺序在松手 change 后重建）
function updateCompareTableOnly() {
  const main = document.getElementById('main');
  const table = main.querySelector('.compare-table');
  const colIds = _compareColumns;
  if (!table || !colIds || colIds.length === 0) return;
  const scores = getCompareCompositeScore(colIds);

  table.querySelectorAll('tr[data-bench]').forEach(tr => {
    const b = tr.dataset.bench;
    const isCost = isCostBench(b);
    const ranking = getBenchRanking(b);
    const vals = colIds.map(id => {
      const hit = ranking.find(r => r.model_id === id);
      return hit ? hit.score_raw : null;
    });
    const valid = vals.filter(v => v != null);
    let bestIdx = -1;
    if (valid.length > 0) {
      const best = isCost ? Math.min(...valid) : Math.max(...valid);
      bestIdx = vals.indexOf(best);
    }
    Array.from(tr.children).slice(1).forEach((td, i) => {
      const v = vals[i];
      td.innerHTML = v == null ? '<span class="compare-empty">—</span>' : (isCost ? formatCost(v) : formatScore(v));
      td.classList.toggle('compare-best', i === bestIdx);
    });
  });

  const compRow = table.querySelector('tr[data-role="composite"]');
  if (compRow) {
    const cs = colIds.map(id => (scores[id] ? scores[id].score : null));
    const valid = cs.filter(v => v != null);
    let bestIdx = -1;
    if (valid.length > 0) bestIdx = cs.indexOf(Math.max(...valid));
    Array.from(compRow.children).slice(1).forEach((td, i) => {
      const v = cs[i];
      td.innerHTML = v == null ? '<span class="compare-empty">—</span>' : v.toFixed(1);
      td.classList.toggle('compare-best', i === bestIdx);
    });
  }
}

// ===== INIT =====
async function initApp() {
  try {
    const response = await fetch('data.json');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    DATA = await response.json();
    // 先注入 config，再算缓存：常量/权重/归一化口径全部以 data.json 为准
    hydrateConfig();
  } catch (err) {
    document.getElementById('main').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">数据加载失败，请通过 HTTP 服务器访问（如 python -m http.server）</div></div>';
    return;
  }

  // Compute caches
  _dimScoresCache = computeDimScores();
  _dimRankCache = computeDimRanks();

  // Set default active bench（取第一个有数据的维度，不写死 factual）
  const firstDim = DIMENSIONS.find(d => hasDimensionData(d.key)) || DIMENSIONS[0];
  if (firstDim) {
    state.activeDimension = firstDim.key;
    const benches = getBenchmarksByDimension(firstDim.key);
    state.activeBench = benches.length > 0 ? benches[0] : null;
  }

  // Restore theme
  const savedTheme = localStorage.getItem('llm-index-theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === savedTheme));
  }

  // Load schemes
  loadSchemes();

  // Render
  updateStats();
  renderProviderChips();
  renderAdvFilter();
  renderDimensionNav();
  renderCurrentView();
  updateCompareCount();
}

// ===== EVENT BINDINGS =====
document.addEventListener('DOMContentLoaded', () => {
  // View tabs
  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.view = btn.dataset.view;
      state.expandedModel = null;
      document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b === btn));
      renderCurrentView();
    });
  });

  // Search
  document.getElementById('search-input').addEventListener('input', (e) => {
    state.searchQuery = e.target.value;
    renderCurrentView();
  });

  // Provider toggle
  document.getElementById('provider-toggle').addEventListener('click', () => {
    const chips = document.getElementById('provider-chips');
    const btn = document.getElementById('provider-toggle');
    chips.classList.toggle('collapsed');
    btn.textContent = chips.classList.contains('collapsed') ? '厂家 ▸' : '厂家 ▾';
  });

  // Theme
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const theme = btn.dataset.theme;
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b === btn));
      localStorage.setItem('llm-index-theme', theme);
      if (radarChart && state.expandedModel) {
        const [modelId] = state.expandedModel.split('|');
        renderRadar(modelId);
      }
    });
  });

  // Advanced filter toggle
  document.getElementById('adv-filter-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    const dropdown = document.getElementById('adv-filter-dropdown');
    const isVisible = dropdown.style.display === 'block';
    dropdown.style.display = isVisible ? 'none' : 'block';
    if (!isVisible) renderAdvFilter();
  });

  // Close dropdown on outside click
  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('adv-filter-dropdown');
    if (dropdown.style.display === 'block' && !e.target.closest('.filter-bar')) {
      dropdown.style.display = 'none';
    }
  });

  // Init app
  initApp();
});
</script>
