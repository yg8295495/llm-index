<!DOCTYPE html>
<html lang="zh-CN" data-theme="apple-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 选型超级助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Orbitron:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- echarts 本地自托管: 原先走 cdn.jsdelivr.net, 国内访客与本机浏览器实测
     ERR_CONNECTION_CLOSED, 雷达图直接挂。改为同源加载, 见 docs/changelog.md #28 -->
<script src="vendor/echarts.min.js"></script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  /* ===================================================
     THEME 1: Apple Light (default)
     =================================================== */
  :root[data-theme="apple-light"]{
    --bg-base:#f5f5f7;
    --bg-surface:#ffffff;
    --bg-elevated:#fafafc;
    --bg-hover:#f0f0f2;
    --bg-section:#e8e8ed;
    --bg-detail:#f0f0f5;
    --text-primary:#1d1d1f;
    --text-secondary:#424245;
    --text-tertiary:#86868b;
    --text-inverse:#ffffff;
    --accent:#0066cc;
    --accent-soft:rgba(0,102,204,.08);
    --accent-heatmap:rgba(0,102,204,.35);
    --accent-hover:#0071e3;
    --border:#d2d2d7;
    --border-bright:rgba(0,0,0,.14);
    --shadow-sm:none;
    --shadow-md:none;
    --shadow-lg:none;
    --success:#28a745;
    --error:#dc3545;
    --gold:#bf8f4d;
    --silver:#6e6e73;
    --bronze:#a87547;
    --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Inter',sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Inter',sans-serif;
    --font-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  }

  /* ===================================================
     THEME 2: Gold Classic (黑金+衬线)
     =================================================== */
  :root[data-theme="gold-classic"]{
    --bg-base:#1a1714;
    --bg-surface:#252019;
    --bg-elevated:#2d2720;
    --bg-hover:#2d2720;
    --bg-section:#352e26;
    --bg-detail:#2a241e;
    --text-primary:#e8dcc8;
    --text-secondary:#b8a88e;
    --text-tertiary:#8a7e68;
    --text-inverse:#1a1714;
    --accent:#d4a853;
    --accent-soft:rgba(212,168,83,.14);
    --accent-heatmap:rgba(212,168,83,.28);
    --accent-hover:#e8c078;
    --border:#3d3529;
    --border-bright:rgba(245,241,232,.18);
    --shadow-sm:none;
    --shadow-md:none;
    --shadow-lg:none;
    --success:#7fa895;
    --error:#c97064;
    --gold:#d4a74a;
    --silver:#b8b5ae;
    --bronze:#a97142;
    --font-display:'Fraunces',Georgia,'Noto Serif SC',serif;
    --font-body:'Inter','PingFang SC','Hiragino Sans GB',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }

  /* ===================================================
     THEME 3: Dark Pro (GitHub Dark style)
     =================================================== */
  :root[data-theme="dark-pro"]{
    --bg-base:#0d1117;
    --bg-surface:#161b22;
    --bg-elevated:#1c2128;
    --bg-hover:#1c2128;
    --bg-section:#21262d;
    --bg-detail:#161b22;
    --text-primary:#e6edf3;
    --text-secondary:#9da5b0;
    --text-tertiary:#6e7681;
    --text-inverse:#0d1117;
    --accent:#58a6ff;
    --accent-soft:rgba(88,166,255,.12);
    --accent-heatmap:rgba(88,166,255,.25);
    --accent-hover:#79c0ff;
    --border:#30363d;
    --border-bright:rgba(240,246,252,.2);
    --shadow-sm:none;
    --shadow-md:none;
    --shadow-lg:none;
    --success:#3fb950;
    --error:#f85149;
    --gold:#d29922;
    --silver:#8b949e;
    --bronze:#db6d28;
    --font-display:'Inter','PingFang SC',sans-serif;
    --font-body:'Inter','PingFang SC',sans-serif;
    --font-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  }

  html{scroll-behavior:smooth}
  body{
    font-family:var(--font-body);
    background:var(--bg-base);
    color:var(--text-primary);
    min-height:100vh;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-feature-settings:"tnum";
  }
  .container{max-width:1600px;margin:0 auto;padding:0 32px}

  /* ===================================================
     TOP BAR: Title + View Tabs (center) + Theme Switcher
     =================================================== */
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:2px solid var(--border-bright);
    gap:16px;
    background:var(--bg-surface);
  }
  .app-title{
    display:flex;
    align-items:center;
    white-space:nowrap;
    line-height:1;
  }
  .logo-img{
    height:40px;
    width:auto;
    display:none;
  }
  :root[data-theme="apple-light"] .logo-light,
  :root[data-theme="dark-pro"] .logo-dark,
  :root[data-theme="gold-classic"] .logo-dark{
    display:block;
  }
  .top-bar-center{
    display:flex;
    justify-content:center;
    flex:1;
  }
  .top-bar-right{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .theme-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-tertiary);
    text-transform:uppercase;
    letter-spacing:.05em;
    white-space:nowrap;
  }
  .theme-switcher{
    display:flex;
    gap:4px;
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:3px;
  }
  .theme-btn{
    font-family:var(--font-mono);
    font-size:11px;
    padding:5px 12px;
    border:none;
    border-radius:6px;
    background:transparent;
    color:var(--text-secondary);
    cursor:pointer;
    transition:background .15s ease,color .15s ease;
    letter-spacing:.03em;
  }
  .theme-btn:hover{color:var(--text-primary)}
  .theme-btn.active{
    background:var(--accent);
    color:var(--text-inverse);
  }

  /* ===================================================
     VIEW TABS (moved into top-bar center)
     =================================================== */
  .view-tabs{
    display:flex;
    gap:4px;
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:3px;
  }
  .view-tab{
    font-family:var(--font-body);
    font-size:12px;
    font-weight:600;
    padding:6px 16px;
    border:none;
    border-radius:6px;
    background:transparent;
    color:var(--text-secondary);
    cursor:pointer;
    transition:background .15s ease,color .15s ease;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .view-tab:hover{color:var(--text-primary)}
  .view-tab.active{
    background:var(--accent);
    color:var(--text-inverse);
  }
  .compare-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:16px;
    height:16px;
    padding:0 4px;
    border-radius:8px;
    background:var(--accent-soft);
    color:var(--accent);
    font-family:var(--font-mono);
    font-size:10px;
    font-weight:600;
  }
  .view-tab.active .compare-count{
    background:rgba(255,255,255,.2);
    color:var(--text-inverse);
  }

  /* ===================================================
     FILTER BAR: search + provider chips + advanced filter
     =================================================== */
  .filter-bar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
    position:relative;
  }
  .search-input{
    font-family:var(--font-body);
    font-size:13px;
    padding:6px 12px;
    width:200px;
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text-primary);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-input::placeholder{color:var(--text-tertiary)}
  .search-input:focus{border-color:var(--accent)}
  .search-input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .filter-chips{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .filter-chips.collapsed{display:none}
  .provider-toggle{
    font-family:var(--font-mono);
    font-size:11px;
    padding:4px 8px;
    border:1px solid var(--border);
    border-radius:6px;
    background:transparent;
    color:var(--text-secondary);
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease;
  }
  .provider-toggle:hover{color:var(--text-primary);border-color:var(--border-bright)}
  .chip{
    font-family:var(--font-mono);
    font-size:11px;
    padding:4px 10px;
    border:1px solid var(--border);
    border-radius:4px;
    background:transparent;
    color:var(--text-secondary);
    cursor:pointer;
    transition:background .12s ease,color .12s ease,border-color .15s ease;
    white-space:nowrap;
  }
  .chip:hover{
    color:var(--text-primary);
    border-color:var(--border-bright);
  }
  .chip.active{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent);
  }
  .filter-right{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto;
    flex-shrink:0;
  }
  .filter-sep{
    color:var(--border-bright);
  }
  .adv-filter-btn{
    font-family:var(--font-body);
    font-size:12px;
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--bg-surface);
    color:var(--text-secondary);
    cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .adv-filter-btn:hover{
    color:var(--text-primary);
    background:var(--bg-hover);
  }
  .adv-filter-dropdown{
    position:absolute;
    top:calc(100% + 4px);
    right:0;
    min-width:260px;
    background:var(--bg-surface);
    border:1px solid var(--border-bright);
    border-radius:8px;
    box-shadow:none;
    padding:12px;
    z-index:50;
  }
  .adv-filter-group{
    padding:8px 0;
    border-bottom:1px solid var(--border);
  }
  .adv-filter-group:last-child{border-bottom:none}
  .adv-filter-label{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-tertiary);
    margin-bottom:6px;
  }
  .adv-filter-options{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }

  /* ===================================================
     STATS INLINE (merged into filter-bar)
     =================================================== */
  .stats-inline{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-tertiary);
    white-space:nowrap;
  }
  .stat-inline{
    color:var(--text-secondary);
  }
  .stat-inline span{
    color:var(--text-primary);
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .stat-sep{
    color:var(--border-bright);
  }

  /* ===================================================
     DIMENSION NAV: two-level tabs
     =================================================== */
  .dimension-nav{
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .dim-nav-row{
    display:flex;
    align-items:center;
    gap:0;
  }
  .dim-tabs{
    display:flex;
    gap:0;
    flex-shrink:0;
  }
  .dim-tab{
    padding:10px 20px;
    border:none;
    border-bottom:2px solid transparent;
    background:transparent;
    cursor:pointer;
    transition:border-color .15s ease,background .12s ease;
    display:flex;
    flex-direction:column;
    gap:2px;
    align-items:flex-start;
  }
  .dim-tab:hover{background:var(--bg-hover)}
  .dim-tab.active{border-bottom-color:var(--accent)}
  .dim-tab-label{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-tertiary);
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .dim-tab-name{
    font-family:var(--font-display);
    font-size:14px;
    font-weight:600;
    color:var(--text-primary);
  }
  .dim-tab.active .dim-tab-name{color:var(--accent)}
  .dim-separator{
    width:1px;
    height:28px;
    background:var(--border-bright);
    margin:0 16px;
    flex-shrink:0;
  }
  .bench-chips{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    overflow:hidden;
    max-height:0;
    opacity:0;
    transition:max-height .3s ease,opacity .25s ease;
  }
  .bench-chips.visible{
    max-height:60px;
    opacity:1;
  }
  .bench-chip{
    position:relative;
    padding:6px 14px;
    border:1px solid var(--border);
    border-radius:9999px;
    background:transparent;
    color:var(--text-secondary);
    cursor:pointer;
    font-family:var(--font-body);
    font-size:12px;
    transition:background .12s ease,color .12s ease,border-color .15s ease;
    white-space:nowrap;
  }
  .bench-chip:hover{
    color:var(--text-primary);
    border-color:var(--border-bright);
  }
  .bench-chip.active{
    background:var(--accent);
    color:var(--text-inverse);
    border-color:var(--accent);
  }
  .bench-chip.active:hover::after{
    content:attr(data-desc);
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%);
    background:var(--bg-elevated);
    color:var(--text-secondary);
    font-size:11px;
    padding:4px 8px;
    border-radius:6px;
    border:1px solid var(--border);
    white-space:nowrap;
    z-index:10;
    margin-top:4px;
    pointer-events:none;
  }

  /* ===================================================
     MAIN
     =================================================== */
  .main{
    padding:16px 0 48px;
  }

  /* ===================================================
     RANKING TABLE (Layer 2 - medium)
     =================================================== */
  .ranking-table{
    background:var(--bg-section);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    position:relative;
  }
  .ranking-table::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:2px;
    background:var(--accent);
    z-index:1;
  }
  .table-header,
  .table-row{
    display:grid;
    grid-template-columns:50px 50px 1fr 70px 100px 70px var(--w-base,62px) 140px 40px 36px;
    align-items:center;
    gap:0;
  }
  /* 无可用基准模型时整列塌掉，不留空表头 */
  .ranking-table.no-baseline{--w-base:0px}
  .ranking-table.no-baseline .th-base,
  .ranking-table.no-baseline .baseline-col{padding:0;overflow:hidden}
  .table-header{
    padding:10px 12px;
    background:var(--bg-elevated);
    border-bottom:1px solid var(--border);
    font-family:var(--font-display);
    font-size:12px;
    font-weight:600;
    letter-spacing:0;
    color:var(--text-primary);
  }
  .table-header > div{padding:0 4px;text-align:center}
  .table-header .th-model{text-align:left}
  .table-row > div{padding:0 4px;text-align:center}
  .table-row .model-cell{text-align:left}
  .table-row{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    transition:background .12s ease;
  }
  .table-row:last-child{border-bottom:none}
  .table-row:hover{background:var(--bg-hover)}
  .table-row.expanded{background:var(--bg-detail)}
  .table-row > div{padding:0 4px}

  .marker-cell{
    display:flex;
    flex-direction:column;
    gap:2px;
    align-items:flex-start;
  }
  .marker{
    font-family:var(--font-mono);
    font-size:9px;
    padding:1px 4px;
    border-radius:9999px;
    line-height:1.4;
    letter-spacing:.02em;
  }
  .marker.mm{background:var(--accent-soft);color:var(--accent)}
  .marker.tts{background:var(--accent-soft);color:var(--accent)}
  .marker.text{background:var(--bg-section);color:var(--text-tertiary)}
  .marker.open{background:rgba(40,167,69,.12);color:var(--success)}
  .marker.closed{background:var(--bg-hover);color:var(--text-tertiary)}
  .marker.mixed{background:var(--accent-soft);color:var(--accent)}

  .rank{
    font-family:var(--font-mono);
    font-size:12px;
    font-weight:600;
    text-align:center;
    color:var(--text-primary);
    font-variant-numeric:tabular-nums;
  }
  .rank.r1{color:var(--gold)}
  .rank.r2{color:var(--silver)}
  .rank.r3{color:var(--bronze)}

  .model-cell{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }
  .model-name{
    font-family:var(--font-display);
    font-size:14px;
    font-weight:600;
    color:var(--text-primary);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .model-id{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-tertiary);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .score-col{
    display:flex;
    flex-direction:column;
    gap:1px;
    align-items:center;
    padding:0 4px;
  }
  .score{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    color:var(--text-primary);
    font-variant-numeric:tabular-nums;
  }
  .score.cost-zero{
    color:var(--error);
    opacity:.7;
  }
  .cost-zero-badge{
    font-family:var(--font-mono);
    font-size:9px;
    padding:1px 4px;
    border-radius:2px;
    background:rgba(220,53,69,.1);
    color:var(--error);
    margin-left:4px;
    vertical-align:middle;
  }
  .sub-dim{
    font-size:11px;
    color:var(--text-secondary);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .subdim-col{
    font-size:11px;
    color:var(--text-secondary);
    padding:0 4px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .comp-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:0 4px;
  }
  .comp-score{
    font-family:var(--font-mono);
    font-size:14px;
    font-weight:400;
    color:var(--text-secondary);
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .comp-rank-badge{
    font-family:var(--font-mono);
    font-size:9px;
    font-weight:600;
    color:var(--accent);
    background:var(--accent-soft);
    padding:1px 5px;
    border-radius:3px;
    line-height:1.3;
  }
  .cost-col{
    display:flex;
    flex-direction:column;
    gap:1px;
    padding:0 4px;
    font-family:var(--font-mono);
    font-feature-settings:"tnum";
    font-size:11px;
    color:var(--text-tertiary);
  }
  .cost-val{
    white-space:nowrap;
  }
  .token-val{
    white-space:nowrap;
  }
  .compare-col{
    display:flex;
    justify-content:center;
  }
  .expand-col{
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .expand-arrow{
    font-size:16px;
    color:var(--accent);
    transition:transform .15s ease;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:24px;
    height:24px;
    border-radius:4px;
    background:var(--accent-soft);
  }
  .expand-arrow.open{
    transform:rotate(90deg);
  }
  .actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
  }
  .action-btn{
    font-family:var(--font-body);
    font-size:11px;
    padding:3px 8px;
    border:1px solid var(--border);
    border-radius:4px;
    background:transparent;
    color:var(--text-secondary);
    cursor:pointer;
    transition:background .12s ease,color .12s ease,border-color .15s ease;
    white-space:nowrap;
  }
  .action-btn:hover{
    color:var(--accent);
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .action-btn.active{
    background:var(--accent);
    color:var(--text-inverse);
    border-color:var(--accent);
  }

  /* ===================================================
     BENCH HEADER: title + stats (flex layout)
     =================================================== */
  .bench-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:8px 0 16px;
    gap:16px;
    flex-wrap:wrap;
  }
  .bench-header-left{
    flex:1;
    min-width:0;
  }
  .bench-title{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:600;
    color:var(--text-primary);
    letter-spacing:-0.01em;
  }
  .bench-desc{
    font-size:12px;
    color:var(--text-secondary);
    margin-top:4px;
  }
  .bench-header-right{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-tertiary);
    white-space:nowrap;
  }
  .bench-stat{
    color:var(--text-secondary);
  }
  .bench-stat-val{
    color:var(--text-primary);
    font-weight:600;
  }
  .bench-stat-total{
    color:var(--text-tertiary);
  }

  /* ===================================================
     DRILLDOWN PANEL: 3-column layout (Layer 3 - lightest)
     =================================================== */
  .drilldown-panel{
    display:grid;
    grid-template-columns:1fr 3fr 1.5fr;
    gap:20px;
    padding:20px;
    background:var(--bg-detail);
    border:1px solid var(--border);
    border-top:none;
    overflow:hidden;
    max-height:0;
    padding-top:0;
    padding-bottom:0;
    border-bottom-left-radius:12px;
    border-bottom-right-radius:12px;
    transition:max-height .25s ease,padding .25s ease;
  }
  .drilldown-panel.open{
    max-height:600px;
    padding-top:20px;
    padding-bottom:20px;
  }
  .drill-left{
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:0;
  }
  .drill-left-title{
    font-family:var(--font-display);
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
    margin-bottom:8px;
  }
  .drill-left-stat{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0;
    border-bottom:1px solid var(--border);
    gap:8px;
  }
  .drill-left-stat:last-child{border-bottom:none}
  .drill-left-label{
    font-size:11px;
    color:var(--text-tertiary);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:normal;
    line-height:1.3;
    max-width:120px;
  }
  .drill-left-value{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-secondary);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .drill-middle{
    min-width:0;
  }
  .dim-cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
  .dim-card{
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    cursor:pointer;
    transition:border-color .15s ease,background .12s ease;
    display:flex;
    flex-direction:column;
  }
  .dim-card:hover{background:var(--bg-hover)}
  .dim-card.active{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .dim-card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
    gap:8px;
  }
  .dim-card-name{
    font-size:12px;
    font-weight:600;
    color:var(--text-primary);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .dim-card-rank{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-tertiary);
    white-space:nowrap;
  }
  .dim-card-score{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:600;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
    margin-bottom:4px;
  }
  .dim-card-expand{
    margin-top:4px;
    padding-top:6px;
    border-top:1px solid var(--border);
    display:none;
  }
  .dim-card.expanded .dim-card-expand{display:block}
  .dim-card-hint{
    font-size:10px;
    color:var(--text-tertiary);
    text-align:center;
    padding:4px 0 0;
    margin-top:4px;
    border-top:1px solid var(--border);
  }
  .dim-card.expanded .dim-card-hint{display:none}
  .dim-sub-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 0;
    cursor:pointer;
    transition:color .12s ease;
    gap:8px;
  }
  .dim-sub-item:hover .dim-sub-name{color:var(--accent)}
  .dim-sub-name{
    font-size:11px;
    color:var(--text-secondary);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
    flex:1 1 auto;
    transition:color .12s ease;
  }
  .dim-sub-score{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-primary);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .dim-sub-rank{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-tertiary);
    white-space:nowrap;
  }

  .drill-right{
    display:flex;
    flex-direction:column;
    gap:12px;
    min-width:0;
  }
  .radar-chart{
    height:200px;
    width:100%;
  }
  .composite-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:8px 0;
    border-bottom:1px solid var(--border);
  }
  .composite-score{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:600;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
    line-height:1.1;
  }
  .composite-rank{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-secondary);
  }
  .reasoning-compare{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .reasoning-title{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-tertiary);
    margin-bottom:4px;
  }
  .reasoning-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 0;
    font-size:11px;
    color:var(--text-secondary);
    gap:8px;
  }
  .reasoning-item.best{
    color:var(--accent);
    font-weight:600;
  }
  .reasoning-item .reasoning-val{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
  }

  /* ===================================================
     MATRIX VIEW (Layer 2 - medium)
     =================================================== */
  .matrix-view{
    background:var(--bg-section);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
  }
  .matrix-table{
    overflow-x:auto;
    overflow-y:auto;
    max-height:80vh;
  }
  .matrix-grid{
    display:inline-grid;
    min-width:100%;
    grid-template-rows:auto auto;
    grid-auto-rows:32px;
  }
  .matrix-dim-header{
    background:var(--bg-elevated);
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    padding:8px 10px;
    font-family:var(--font-display);
    font-size:12px;
    font-weight:600;
    color:var(--text-primary);
    text-align:center;
    position:sticky;
    top:0;
    z-index:2;
  }
  .matrix-dim-header::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:2px;
    background:var(--accent);
  }
  .matrix-bench-header{
    background:var(--bg-elevated);
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    padding:4px 2px;
    font-family:var(--font-mono);
    font-size:10px;
    line-height:1.2;
    color:var(--text-tertiary);
    text-align:center;
    white-space:normal;
    word-break:break-all;
    position:sticky;
    z-index:2;
  }
  .matrix-row{
    display:contents;
  }
  .matrix-row > .matrix-cell,
  .matrix-row > .matrix-row-label{
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  .matrix-row-label{
    padding:8px 12px;
    font-family:var(--font-display);
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
    background:var(--bg-elevated);
    position:sticky;
    left:0;
    z-index:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:center;
  }
  .matrix-cell{
    padding:0 8px;
    text-align:center;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-secondary);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .matrix-cell.empty{color:var(--text-tertiary)}
  .matrix-cell.heatmap{
    background-image:linear-gradient(to right,var(--accent-heatmap) var(--heat-pct,0%),transparent var(--heat-pct,0%));
    background-color:var(--bg-surface);
  }
  .matrix-cell.best{
    color:var(--accent);
    font-weight:600;
  }

  /* ===================================================
     COMPARE VIEW (Layer 2 - medium)
     =================================================== */
  .compare-view{
    background:var(--bg-section);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:auto;
    max-height:80vh;
  }
  .compare-table{
    width:100%;
    border-collapse:collapse;
  }
  .compare-table th,
  .compare-table td{
    padding:8px 12px;
    text-align:left;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    font-size:13px;
  }
  .compare-table th:last-child,
  .compare-table td:last-child{border-right:none}
  .compare-table tr:last-child td{border-bottom:none}
  .compare-table thead th{
    background:var(--bg-elevated);
    font-family:var(--font-display);
    font-size:12px;
    font-weight:600;
    color:var(--text-primary);
    position:sticky;
    top:0;
    z-index:10;
  }
  .compare-col-header{
    min-width:140px;
  }
  .compare-row-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-secondary);
    text-transform:uppercase;
    letter-spacing:.03em;
    background:var(--bg-elevated);
    white-space:nowrap;
  }
  .compare-cell{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
    color:var(--text-secondary);
  }
  .compare-best{
    color:var(--accent);
    font-weight:600;
    background:var(--accent-soft);
  }
  .compare-empty{
    color:var(--text-tertiary);
  }

  /* ===================================================
     SCHEMES VIEW
     =================================================== */
  .schemes-view{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .schemes-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .schemes-title{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:600;
    color:var(--text-primary);
  }
  .scheme-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .scheme-card{
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    transition:border-color .15s ease;
  }
  .scheme-card:hover{border-color:var(--border-bright)}
  .scheme-card.editing{
    border-color:var(--accent);
    background:var(--bg-section);
  }
  .scheme-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    gap:12px;
  }
  .scheme-name{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:600;
    color:var(--text-primary);
  }
  .scheme-actions{
    display:flex;
    gap:6px;
  }
  .scheme-weights{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .weight-item{
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:80px;
    flex:1;
  }
  .weight-item-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:6px;
  }
  .weight-item-label{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-tertiary);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .weight-item-value{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-primary);
    font-variant-numeric:tabular-nums;
  }
  .weight-bar{
    height:4px;
    background:var(--bg-hover);
    border-radius:2px;
    overflow:hidden;
  }
  .weight-bar-fill{
    height:100%;
    background:var(--accent);
    border-radius:2px;
    transition:width .2s ease;
  }
  .scheme-editor{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
    display:none;
  }
  .scheme-card.editing .scheme-editor{display:block}
  .weight-slider-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:6px 0;
  }
  .weight-slider-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-secondary);
    min-width:100px;
  }
  .dim-help-icon{
    display:inline-block;
    width:14px;
    height:14px;
    line-height:14px;
    text-align:center;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:10px;
    font-weight:600;
    cursor:help;
    margin-left:4px;
    vertical-align:middle;
  }
  .dim-help-icon:hover{
    background:var(--accent);
    color:var(--text-inverse);
  }
  .weight-slider{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    background:var(--bg-hover);
    border-radius:2px;
    outline:none;
  }
  .weight-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
  }
  .weight-slider::-moz-range-thumb{
    width:14px;
    height:14px;
    border:none;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
  }
  .weight-slider-value{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-primary);
    min-width:40px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .sub-dim-row{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:8px;
    margin:8px 0 8px 32px;
    padding:8px 12px;
    background:var(--bg-detail);
    border-radius:6px;
    border:1px solid var(--border);
  }
  .sub-dim-item{
    display:grid;
    grid-template-columns:70px 1fr 35px;
    align-items:center;
    gap:6px;
    padding:4px 8px;
    background:var(--bg-surface);
    border-radius:4px;
    border:1px solid var(--border);
  }
  .sub-dim-label{
    font-size:11px;
    color:var(--text-secondary);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sub-dim-slider{
    width:100%;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    background:var(--bg-hover);
    border-radius:2px;
    outline:none;
  }
  .sub-dim-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
  }
  .sub-dim-slider::-moz-range-thumb{
    width:12px;
    height:12px;
    border:none;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
  }
  .sub-dim-value{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-primary);
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .scheme-editor-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .scheme-editor-actions .action-btn{padding:6px 14px;font-size:12px}

  /* ===================================================
     EMPTY STATE
     =================================================== */
  main > .empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:64px 24px;
    color:var(--text-tertiary);
    text-align:center;
  }
  .empty-icon{
    font-size:32px;
    opacity:.5;
  }
  .empty-text{
    font-size:13px;
  }

  /* ===================================================
     SCROLLBAR
     =================================================== */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{
    background:var(--border-bright);
    border-radius:4px;
  }
  ::-webkit-scrollbar-thumb:hover{background:var(--text-tertiary)}

  /* ===================================================
     RESPONSIVE
     =================================================== */
  @media (max-width:1280px){
    .drilldown-panel{
      grid-template-columns:1fr 2fr 1fr;
      gap:16px;
    }
    .dim-cards{grid-template-columns:1fr 1fr}
  }

  /* ===================================================
     PROVENANCE / BASELINE / REFERENCE / DOCS (新增语义元素)
     =================================================== */
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  /* 出处链接与状态徽标 */
  .src-link{
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px dashed var(--accent);
    font-family:var(--font-mono);
    font-size:11px;
  }
  .src-link:hover{color:var(--accent-hover);border-bottom-style:solid}
  .src-badge{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:9px;
    line-height:1.5;
    padding:0 5px;
    border-radius:9999px;
    border:1px solid var(--border);
    color:var(--text-tertiary);
    background:var(--bg-hover);
    letter-spacing:.02em;
    text-transform:none;
    vertical-align:middle;
  }
  .src-badge.inline{margin-left:4px;font-size:8px;padding:0 4px}
  .src-badge.src-stale,
  .src-badge.src-empty{color:var(--error);border-color:var(--error);background:transparent}
  .src-badge.src-beta{color:var(--gold);border-color:var(--gold);background:transparent}
  .chip-status{
    display:inline-block;
    margin-left:4px;
    font-family:var(--font-mono);
    font-size:8px;
    color:var(--text-tertiary);
    opacity:.8;
  }
  .bench-chip .src-badge{background:transparent;margin-left:4px}
  .view-source-line{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-tertiary);
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    background:var(--bg-elevated);
  }

  /* 排行榜控制区（基准 + 参照开关） */
  .rank-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ctl-label{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-tertiary);
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .ctl-select{
    font-family:var(--font-body);
    font-size:12px;
    color:var(--text-primary);
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:4px;
    padding:3px 6px;
    max-width:260px;
    cursor:pointer;
  }
  .ctl-select:hover{border-color:var(--accent)}

  /* vs 基准列 */
  .baseline-col{
    font-family:var(--font-mono);
    font-size:12px;
    font-variant-numeric:tabular-nums;
    color:var(--text-tertiary);
  }
  .delta{font-weight:600}
  .delta.pos{color:var(--success)}
  .delta.neg{color:var(--error)}
  .delta-base{
    font-family:var(--font-mono);
    font-size:9px;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:9999px;
    padding:0 5px;
  }
  .th-base{font-size:11px}

  /* 参照模型 */
  .marker.ref{background:var(--bg-hover);color:var(--text-tertiary);border:1px dashed var(--border-bright)}
  .ref-note{
    font-family:var(--font-mono);
    font-size:9px;
    color:var(--text-tertiary);
    letter-spacing:.02em;
  }
  .table-row.is-reference{opacity:.62}
  .table-row.is-reference:hover{opacity:1}
  .table-row.is-reference .model-name{font-weight:500;color:var(--text-secondary)}
  .ref-block{margin-top:20px}
  .ref-block-title{
    font-family:var(--font-display);
    font-size:12px;
    font-weight:600;
    color:var(--text-tertiary);
    letter-spacing:.02em;
    padding:0 2px 8px;
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .ref-block-sub{font-family:var(--font-mono);font-size:10px;font-weight:400;opacity:.8}
  .ref-table{border-style:dashed;background:transparent}
  .ref-table .table-header{background:var(--bg-detail)}
  .matrix-row-label.is-reference{color:var(--text-tertiary);font-weight:500}

  /* 钻取面板：出处 + 覆盖率 */
  .dim-sub-meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:1px;
    line-height:1.3;

  .dim-sub-src{

  .dim-sub-src a{color:var(--text-tertiary);text-decoration:underline}

  .dim-card-cov{
    font-family:var(--font-mono);
    font-size:9px;
    color:var(--text-tertiary);
    text-align:center;
    margin-top:2px;
  }
  .drill-left-value a{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}
  .radar-fallback{display:flex;flex-direction:column;gap:6px;padding:4px 0}
  .radar-fallback-row{display:grid;grid-template-columns:64px 1fr 38px;align-items:center;gap:8px;font-size:11px;color:var(--text-secondary)}
  .radar-fallback-bar{height:6px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:9999px;overflow:hidden}
  .radar-fallback-bar > span{display:block;height:100%;background:var(--accent)}
  .radar-fallback-note{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary);margin-top:4px;text-align:center}

  /* 数据说明面板 */
  .docs-view{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:16px;
    align-items:start;
  }
  .doc-card{
    background:var(--bg-section);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    min-width:0;
  }
  .doc-card.wide{grid-column:1/-1}
  .doc-card-title{
    font-family:var(--font-display);
    font-size:14px;
    font-weight:600;
    color:var(--text-primary);
    margin-bottom:12px;
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .doc-card-sub,.doc-card-sub2{
    font-family:var(--font-mono);
    font-size:10px;
    font-weight:400;
    color:var(--text-tertiary);
  }
  .doc-card-sub2{margin:14px 0 8px;letter-spacing:.04em;text-transform:uppercase}
  .doc-kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .doc-kv{display:flex;flex-direction:column;gap:2px;min-width:0}
  .doc-k-label{
    font-family:var(--font-mono);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-tertiary);
  }
  .doc-k-value{font-size:13px;color:var(--text-primary);word-break:break-all}
  .doc-note{
    font-size:11px;
    color:var(--text-secondary);
    line-height:1.6;
    margin-top:10px;
  }
  .doc-caveat{
    font-size:12px;
    color:var(--text-secondary);
    line-height:1.75;
    border-left:2px solid var(--accent);
    padding-left:12px;
  }
  .doc-table{width:100%;border-collapse:collapse;font-size:11px}
  .doc-table th{
    text-align:left;
    font-family:var(--font-mono);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-tertiary);
    font-weight:400;
    padding:4px 8px 4px 0;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  .doc-table td{
    padding:6px 8px 6px 0;
    border-bottom:1px solid var(--border);
    color:var(--text-secondary);
    vertical-align:top;
  }
  .doc-table tr:last-child td{border-bottom:none}
  .doc-table td.mono{color:var(--text-primary);white-space:nowrap}
  .doc-sha{cursor:help}
  .doc-notes{max-width:280px;font-size:10px;line-height:1.5;color:var(--text-tertiary)}
  .doc-sha-full{
    font-size:11px;
    color:var(--text-primary);
    word-break:break-all;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:6px;
    padding:8px 10px;
  }
  .doc-list{list-style:none;display:flex;flex-direction:column;gap:8px}
  .doc-list li{font-size:12px;color:var(--text-secondary);line-height:1.6;word-break:break-all}
  .doc-link{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
  .doc-link:hover{border-bottom-color:var(--accent)}
  .doc-empty{color:var(--text-tertiary)}
  .doc-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
  .doc-dl dt{font-size:11px;color:var(--accent);white-space:nowrap}
  .doc-dl dd{font-size:12px;color:var(--text-secondary);line-height:1.6}
  .doc-weights{display:flex;flex-direction:column;gap:8px}
  .doc-weight{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:10px}
  .doc-weight-name{font-size:12px;color:var(--text-secondary)}
  .doc-weight-bar{height:6px;background:var(--bg-elevated);border-radius:9999px;overflow:hidden;border:1px solid var(--border)}
  .doc-weight-fill{display:block;height:100%;background:var(--accent)}
  .doc-weight-val{font-size:11px;color:var(--text-primary);text-align:right}
  .doc-preset-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .doc-preset{
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    background:var(--bg-elevated);
  }
  .doc-preset.active{border-color:var(--accent);background:var(--accent-soft)}
  .doc-preset-name{font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--text-primary)}
  .doc-preset-desc{font-size:10px;color:var(--text-tertiary);line-height:1.5;margin:3px 0}
  .doc-preset-w{font-size:9px;color:var(--text-secondary);line-height:1.5}

  @media (max-width:1024px){
    .table-header,
    .table-row{
      grid-template-columns:50px 50px 1fr 70px 70px var(--w-base,62px) 40px 30px;

    .th-subdim,
    .subdim-col,
    .th-cost,
    .cost-col{display:none}
    .drilldown-panel{
      grid-template-columns:1fr;
      gap:16px;

  @media (max-width:768px){
    .container{padding:0 16px}
    .top-bar{flex-direction:column;align-items:flex-start;gap:12px}
    .stats-row{gap:20px;flex-wrap:wrap}
    .table-header,
    .table-row{
      grid-template-columns:40px 40px 1fr 70px;
    }
    .th-subdim,.subdim-col,
    .th-cost,.cost-col,
    .th-comp,.comp-col,
    .th-base,.baseline-col,
    .th-compare,.compare-col,

    .dim-tabs{overflow-x:auto}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
  /* ===== 榜单视图 ===== */
  .board-caption{
    font-size:12px;color:var(--text-secondary);line-height:1.6;
    margin:0 0 12px;padding:8px 10px;background:var(--bg-secondary);

  .board-footnote{
    font-size:11px;color:var(--text-tertiary);line-height:1.6;margin-top:12px;
  }

  .board-rank{
    display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;
    font-size:10px;font-weight:500;color:var(--text-tertiary);
    background:var(--bg-tertiary);
  }
  .delta-up{color:var(--positive,#4a7c59);font-variant-numeric:tabular-nums}
  .delta-down{color:var(--negative,#a8555a);font-variant-numeric:tabular-nums}
  .delta-base{color:var(--text-tertiary);font-size:11px}
  /* 厂商自报数据块：视觉上与榜单分开，避免被误读成同口径 */
  .official-block{margin:10px 0;padding:10px 12px;border:1px dashed var(--border);
    border-radius:6px;background:var(--bg-secondary)}
  .official-name{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
  .official-list{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.7}
  .official-list li{padding:3px 0;border-top:1px solid var(--border)}
  .official-list li:first-child{border-top:0}
  .official-list b{font-variant-numeric:tabular-nums;color:var(--text-primary)}
  .official-unit{color:var(--text-tertiary);font-size:11px}
  .official-note{color:var(--text-tertiary);font-size:11px;margin-top:2px}
  .official-caveat{font-size:11px;color:var(--text-tertiary);line-height:1.6;margin-top:8px}
  @media (max-width:760px){
    .board-caption{font-size:11px}
  }
</style>
</head>
<body>
<div class="container">
  <!-- 顶部栏：标题 + 视图tabs(居中) + 主题切换 -->
  <div class="top-bar">
    <h1 class="app-title">
  <img src="logo-light.png" alt="AI 选型超级助手" class="logo-img logo-light">
  <img src="logo-dark.png" alt="AI 选型超级助手" class="logo-img logo-dark">
</h1>
    <div class="top-bar-center">
      <div class="view-tabs">
        <button class="view-tab active" data-view="ranking">排行榜</button>
        <button class="view-tab" data-view="board">榜单</button>
        <button class="view-tab" data-view="matrix">矩阵总览</button>
        <button class="view-tab" data-view="compare">对比<span class="compare-count" id="compare-count" style="display:none">0</span></button>
        <button class="view-tab" data-view="schemes">我的方案</button>
        <button class="view-tab" data-view="docs">数据说明</button>
      </div>
    </div>
    <div class="top-bar-right">
      <span class="theme-label">主题</span>
      <div class="theme-switcher">
        <button class="theme-btn active" data-theme="apple-light">Apple Light</button>
        <button class="theme-btn" data-theme="gold-classic">Gold Classic</button>
        <button class="theme-btn" data-theme="dark-pro">Dark Pro</button>
      </div>
    </div>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-bar">
    <input type="text" class="search-input" id="search-input" placeholder="搜索模型…" aria-label="搜索模型">
    <button class="provider-toggle" id="provider-toggle" title="收起/展开厂家筛选">厂家 ▾</button>
    <div class="filter-chips" id="provider-chips"></div>
    <div class="filter-right">
      <div class="stats-inline" id="stats-inline">
        <span class="stat-inline"><span id="stat-models">0</span> 模型</span>
        <span class="stat-sep">|</span>
        <span class="stat-inline"><span id="stat-core-models">0</span> 在榜</span>
        <span class="stat-sep">|</span>
        <span class="stat-inline"><span id="stat-benchmarks">0</span> 评测</span>
        <span class="stat-sep">|</span>
        <span class="stat-inline"><span id="stat-obs">0</span> 数据点</span>
        <span class="stat-sep">|</span>
        <span class="stat-inline"><span id="stat-dims">5</span> 维度</span>
        <span class="stat-sep">|</span>
        <span class="stat-inline">数据截止 <span id="stat-snapshot">—</span></span>
      </div>
      <span class="filter-sep">|</span>
      <button class="adv-filter-btn" id="adv-filter-btn">高级筛选 ▾</button>
    </div>
    <div class="adv-filter-dropdown" id="adv-filter-dropdown" style="display:none">
      <!-- 筛选项动态生成 -->
    </div>
  </div>

  <!-- 维度导航（仅排行榜视图显示） -->
  <div class="dimension-nav" id="dimension-nav">
    <div class="dim-nav-row">
      <div class="dim-tabs" id="dim-tabs"></div>
      <div class="dim-separator"></div>
      <div class="bench-chips" id="bench-chips"></div>
    </div>
  </div>

  <!-- 主内容区 -->
  <main class="main" id="main"></main>
</div>

<script>
// 兜底权重（config.weights 缺失时使用）
const DEFAULT_WEIGHTS = { factual: 0.25, workflow: 0.25, engineering: 0.20, cost: 0.15, preference: 0.15 };

// ===== STATE & CONSTANTS =====
const state = {
  view: 'ranking',
  activeDimension: 'factual',
  activeBench: null,
  searchQuery: '',
  activeProviders: new Set(),
  advFilters: { releaseTime: 'all', rankRange: 'all', openSource: 'all', multimodal: 'all', reasoningLevel: 'all' },
  expandedModel: null,
  _drillExpandedRow: 1,
  compareList: [],
  schemes: [],
  activeScheme: null,
  editingSchemeId: null,
  weights: { ...DEFAULT_WEIGHTS },  // 兜底值，实际由 hydrateConfig() 从 config.weights 注入
  benchWeights: {},  // 子维度权重：{ benchmark_key: weight }
  rankingSort: { key: 'rank', desc: true },
  baseline: null,          // 「vs 基准」列的基准模型 id，来自 config.baseline
  includeReference: false, // 排行榜主列表是否并入参照模型
  board: 'capability',     // 榜单视图当前榜型：capability 能力榜 / value 性价比榜 / composite 综合榜
  expandedWeightDim: null  // 对比视图权重面板：当前展开子维度的主维度 key，null=全部收起
};

// ===== 兜底常量 =====
// data.json 带 config 时由 hydrateConfig() 覆盖；缺省时页面仍可运行（旧版 data.json）
const DEFAULT_DIMENSIONS = [
  { key: 'factual', name: '事实准确', desc: '模型回答事实性问题的准确程度。综合知识问答、研究生级别专业问答、数学推理等评测，分数越高表示模型给出的事实越可靠，适合需要准确信息的场景（如医疗、法律、学术咨询）。' },
  { key: 'workflow', name: '工作流', desc: '模型作为自主 Agent 完成复杂任务的能力。包括工具调用、多步规划、指令遵循、银行/编程等场景的自动化执行能力。分数越高表示模型越能独立完成端到端的工作流任务。' },
  { key: 'engineering', name: '工程能力', desc: '模型的实际编码和工程动手能力。包括终端操作、科学编程、实时编程、代码生成等评测。分数越高表示模型作为编程助手时越能交付高质量代码、减少出错。' },
  { key: 'cost', name: '成本', desc: '模型的使用成本。包括跑完整轮评测的实际消耗（美元/轮）和 API 定价参考。分数越高表示越便宜，适合预算敏感的场景。' },
  { key: 'preference', name: '人类偏好', desc: '真实用户盲测投票的 Elo 评分（来自 LMArena）。分数越高表示用户实际体验越好，反映模型的综合使用感受。' }
];

const DEFAULT_BENCH_GROUPS = {
  factual: ['aa_omniscience', 'gpqa', 'hle', 'aime25', 'aime'],
  workflow: ['gdpval_aa', 'gdpval_aa_normalized', 'ifbench', 'tau2_banking', 'tau_banking', 'agentic_index'],
  engineering: ['terminalbench_hard', 'scicode', 'livecodebench', 'coding_index'],
  cost: ['cost_per_eval', 'pricing'],
  preference: ['lmarena_text']
};

const DEFAULT_BENCH_CN = {
  aa_omniscience: '综合知识指数', gpqa: '研究生问答', hle: '人类终极考试',
  aime25: '数学邀请赛2025', aime: '数学邀请赛',
  gdpval_aa: 'Agent能力Elo', gdpval_aa_normalized: 'Agent归一化', ifbench: '指令遵循',
  tau2_banking: '银行场景Agent', tau_banking: '银行场景Agent旧版', agentic_index: 'Agent综合指数',
  terminalbench_hard: '终端任务Hard', scicode: '科学编程', livecodebench: '实时编程', coding_index: '编程综合指数',
  cost_per_task: '实际消耗', cost_per_eval: '整轮评测消耗', pricing: '定价参考', lmarena_text: 'LMArena'
};

// 厂家展示名 + 低饱和色板（色板仅作为已知厂家的固定色，未知厂家由 providerColor() 哈希推导）
const DEFAULT_PROVIDER_META = {
  anthropic: { display: 'Anthropic', color: '#c4956a' },
  google: { display: 'Google', color: '#7fa895' },
  deepseek: { display: 'DeepSeek', color: '#9b8fd4' },
  kimi: { display: 'Kimi', color: '#c97064' },
  minimax: { display: 'MiniMax', color: '#a98d6f' },
  qwen: { display: 'Qwen', color: '#8fa8c4' },
  openai: { display: 'OpenAI', color: '#0071e3' },
  mimo: { display: 'MiMo', color: '#8fb4a4' },
  glm: { display: 'GLM', color: '#b48fd4' },
  zhipu: { display: 'Zhipu', color: '#b48fd4' },
  moonshot: { display: 'Moonshot', color: '#c97064' },
  xiaomi: { display: 'Xiaomi', color: '#8fb4a4' }
};

const DEFAULT_NORMALIZATION = {
  method: 'min-max',
  min_score: 0,
  max_score: 100,
  cost_reverse: true,
  missing_value: { strategy: 'exclude_and_reweight', coverage_penalty: true, min_coverage_ratio: 0 }
};

// 成本类 benchmark：显式名单兜底 + benchmark_meta.dimension === 'cost' 自动识别
const COST_BENCH_KEYS = ['cost_per_eval', 'pricing', 'cost_per_task'];

// ===== 运行时配置（hydrateConfig() 填充，默认取兜底值） =====
let DIMENSIONS = DEFAULT_DIMENSIONS;
let BENCH_GROUPS = DEFAULT_BENCH_GROUPS;   // 统一为 { dimKey: [benchKey, ...] }
let BENCH_CN = DEFAULT_BENCH_CN;
let PROVIDER_META = DEFAULT_PROVIDER_META;
let NORMALIZATION = DEFAULT_NORMALIZATION;
let BASELINE_CANDIDATES = [];
let WEIGHTS_NO_PREFERENCE = null;

let DATA = null;
let radarChart = null;
let _dimScoresCache = null;
let _dimRankCache = null;
let _compositeCache = null;
let _dimCoverageCache = null;
let _benchRankCache = null;
let _compareColumns = [];  // 对比表当前列顺序，供权重拖动时原位刷新用
let _matrixSort = { key: null, desc: true };

// 把 data.json 的 config 段注入运行时常量。缺字段时保留兜底值，保证旧数据可渲染。
function hydrateConfig() {
  const cfg = (DATA && DATA.config) || {};
  const has = (o) => o && typeof o === 'object';

  // 维度：config.dimensions 已是 {key,name,desc,weight} 形状
  if (Array.isArray(cfg.dimensions) && cfg.dimensions.length > 0) {
    const dims = cfg.dimensions.filter(d => has(d) && d.key)
      .map(d => ({ key: d.key, name: d.name || d.key, desc: d.desc || d.description || '', weight: typeof d.weight === 'number' ? d.weight : null }));
    if (dims.length > 0) DIMENSIONS = dims;
  }

  // benchmark 分组：{ dimKey: [benchKey, ...] }，缺失的维度退回兜底
  if (has(cfg.bench_groups)) {
    const groups = {};
    DIMENSIONS.forEach(dim => {
      const list = cfg.bench_groups[dim.key];
      groups[dim.key] = Array.isArray(list) ? list.slice() : (DEFAULT_BENCH_GROUPS[dim.key] || []).slice();
    });
    // config 里存在但不在 dimensions 中的分组也保留（前向兼容）
    Object.keys(cfg.bench_groups).forEach(k => {
      if (!groups[k] && Array.isArray(cfg.bench_groups[k])) groups[k] = cfg.bench_groups[k].slice();
    });
    BENCH_GROUPS = groups;
  }

  if (has(cfg.bench_cn) && Object.keys(cfg.bench_cn).length > 0) {
    BENCH_CN = Object.assign({}, DEFAULT_BENCH_CN, cfg.bench_cn);
  }

  // 厂家：展示名取 config.providers，颜色沿用固定色板，未知命名空间按哈希推导稳定低饱和色
  if (has(cfg.providers) && Object.keys(cfg.providers).length > 0) {
    const merged = {};
    Object.keys(cfg.providers).forEach(ns => {
      const p = cfg.providers[ns] || {};
      merged[ns] = {
        display: p.display || ns,
        tier: p.tier || null,
        color: (DEFAULT_PROVIDER_META[ns] && DEFAULT_PROVIDER_META[ns].color) || providerColor(ns)
      };
    });
    Object.keys(DEFAULT_PROVIDER_META).forEach(ns => {
      if (!merged[ns]) merged[ns] = Object.assign({}, DEFAULT_PROVIDER_META[ns]);
    });
    PROVIDER_META = merged;
  }

  NORMALIZATION = has(cfg.normalization) ? Object.assign({}, DEFAULT_NORMALIZATION, cfg.normalization) : DEFAULT_NORMALIZATION;
  if (!NORMALIZATION.missing_value) NORMALIZATION.missing_value = DEFAULT_NORMALIZATION.missing_value;

  // 权重 + 基准锚点
  state.weights = defaultWeights();
  WEIGHTS_NO_PREFERENCE = has(cfg.weights_no_preference) ? cfg.weights_no_preference : null;

  const bl = has(cfg.baseline) ? cfg.baseline : null;
  const present = DATA && DATA.models ? DATA.models : {};
  const pool = bl ? [bl.default].concat(Array.isArray(bl.candidates) ? bl.candidates : []) : [];
  BASELINE_CANDIDATES = pool
    .filter((id, i) => pool.indexOf(id) === i)     // default 可能同时出现在 candidates 里
    .filter(id => !!present[id]);
  state.baseline = BASELINE_CANDIDATES.length > 0 ? BASELINE_CANDIDATES[0] : null;

  // 默认维度：config.dimensions 里的第一个若与兜底 activeDimension 不符则纠正
  if (!DIMENSIONS.some(d => d.key === state.activeDimension) && DIMENSIONS.length > 0) {
    state.activeDimension = DIMENSIONS[0].key;
  }
  invalidateAllCaches();
}

// 命名空间 → 稳定、柔和（低饱和中低亮度）的 HSL 色，避免抢占页面主色
function providerColor(ns) {
  let h = 2166136261;
  const s = String(ns);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  const hue = h % 360;
  const sat = 24 + ((h >>> 8) % 14);    // 24%-37%
  const light = 44 + ((h >>> 16) % 12); // 44%-55%
  return 'hsl(' + hue + ',' + sat + '%,' + light + '%)';
}

// benchmark 短标签：config.bench_cn 给的是全名（含英文括注），这里压成短名
function benchLabel(benchKey) {
  const meta = (DATA && DATA.benchmark_meta && DATA.benchmark_meta[benchKey]) || {};
  const candidates = [BENCH_CN[benchKey], meta.name, DEFAULT_BENCH_CN[benchKey]];
  for (let i = 0; i < candidates.length; i++) {
    const raw = candidates[i];
    if (!raw) continue;
    const short = String(raw)
      .replace(/\s*[（(][^）)]*[)）]\s*/g, '')  // 去掉尾部/中部英文括注
      .replace(/\s*·.*$/, '')                     // 去掉「· 中位」这类后缀限定
      .trim();
    if (short && /[\u4e00-\u9fa5]/.test(short)) return short;
  }
  return candidates.find(Boolean) || benchKey;
}

// benchmark 提示文案：note 优先，其次全名
function benchTooltip(benchKey) {
  const meta = (DATA && DATA.benchmark_meta && DATA.benchmark_meta[benchKey]) || {};
  return meta.note || meta.description || meta.name || BENCH_CN[benchKey] || benchKey;
}

// benchmark 原始链接：优先取数据条目，其次 benchmark_meta
function benchSourceUrl(benchKey) {
  const meta = (DATA && DATA.benchmark_meta && DATA.benchmark_meta[benchKey]) || {};
  if (meta.source_url) return meta.source_url;
  const arr = (DATA && DATA.benchmarks && DATA.benchmarks[benchKey]) || [];
  for (let i = 0; i < arr.length; i++) if (arr[i].source_url) return arr[i].source_url;
  return (DATA && DATA.provenance && DATA.provenance.leaderboard_url) || null;
}

// 矩阵列头：短名自动折成两行，避免依赖写死的 benchmark 名单
function wrapBenchLabel(label) {
  const s = String(label || '');
  if (s.length <= 5) return s;
  let cut = Math.ceil(s.length / 2);
  const sp = s.indexOf(' ', 2);
  if (sp > 0 && sp < s.length - 2 && sp <= cut + 2) cut = sp;
  return s.slice(0, cut).trim() + '<br>' + s.slice(cut).trim();
}

// 默认权重：config.weights 优先，退回 config.dimensions[].weight，再退回兜底常量
function defaultWeights() {
  const cfg = (DATA && DATA.config) || {};
  const src = (cfg.weights && typeof cfg.weights === 'object') ? cfg.weights : DEFAULT_WEIGHTS;
  const w = {};
  DIMENSIONS.forEach(dim => {
    let v = src[dim.key];
    if (typeof v !== 'number') v = typeof dim.weight === 'number' ? dim.weight : (DEFAULT_WEIGHTS[dim.key] || 0);
    w[dim.key] = v;
  });
  return w;
}

// 数据源可靠性标记：thin/过期/测试态一律显式标注，不把薄数据当硬数据
function benchStatus(benchKey) {
  const meta = (DATA && DATA.benchmark_meta && DATA.benchmark_meta[benchKey]) || {};
  const s = meta.status;
  return (s === 'stale' || s === 'empty' || s === 'beta') ? s : null;
}

function benchStatusBadge(benchKey, cls) {
  const s = benchStatus(benchKey);
  if (!s) return '';
  return `<span class="src-badge ${cls || ''} src-${s}" data-tooltip="benchmark_meta.status = ${s}：样本有限或口径未定，勿当硬结论">${s}</span>`;
}

// 快照日（metadata.snapshot_date），旧数据缺省时退回条目自带 observed_at
function snapshotDate() {
  return (DATA && DATA.metadata && DATA.metadata.snapshot_date) || null;
}

function entryDate(item) {
  if (item && item.observed_at) return item.observed_at;
  return snapshotDate();
}

// ===== DATA UTILITIES =====
function getModel(modelId) {
  if (!DATA || !DATA.models) return null;
  return DATA.models[modelId] || null;
}

// 是否成本类（越低越好）benchmark：显式名单兜底 + benchmark_meta 自动识别
function isCostBench(benchKey) {
  if (COST_BENCH_KEYS.indexOf(benchKey) >= 0) return true;
  const meta = (DATA && DATA.benchmark_meta && DATA.benchmark_meta[benchKey]) || null;
  if (!meta) return false;
  if (meta.dimension === 'cost') return true;
  return meta.direction === 'lower' && NORMALIZATION.cost_reverse !== false;
}

function getBenchRanking(benchKey) {
  if (!DATA || !DATA.benchmarks || !DATA.benchmarks[benchKey]) return [];
  if (!_benchRankCache) _benchRankCache = {};
  if (_benchRankCache[benchKey]) return _benchRankCache[benchKey];
  const isCost = isCostBench(benchKey);
  const result = DATA.benchmarks[benchKey]
    .filter(item => item.score_raw != null)
    .map(item => ({ ...item }));
  result.sort((a, b) => isCost ? a.score_raw - b.score_raw : b.score_raw - a.score_raw);
  result.forEach((item, idx) => { item.rank = idx + 1; });
  _benchRankCache[benchKey] = result;
  return result;
}

// 成本维度取 cost_per_eval（真实整轮消耗），旧数据退回 terminalbench_hard 的 cost_usd
function getCostProxyBench() {
  if (DATA && DATA.benchmarks) {
    if ((DATA.benchmarks.cost_per_eval || []).length > 0) return 'cost_per_eval';
    if ((DATA.benchmarks.cost_per_task || []).length > 0) return 'cost_per_task';
    if ((DATA.benchmarks.pricing || []).length > 0) return 'pricing';
  }
  return null;
}

function getFilteredRanking(benchKey) {
  const ranking = getBenchRanking(benchKey);
  return ranking.filter(item => applyFilters(item));
}

function getBenchmarksByDimension(dimKey) {
  const benches = BENCH_GROUPS[dimKey];
  if (!Array.isArray(benches)) return [];
  return benches.filter(b => getBenchRanking(b).length > 0);
}

function hasDimensionData(dimKey) {
  return getBenchmarksByDimension(dimKey).length > 0;
}

// 维度内可比的 benchmark（≥2 个不同取值）——单值数据源没有区分度，不参与归一化
function getUsableBenches(dimKey) {
  return getBenchmarksByDimension(dimKey).filter(b => {
    const ranking = getBenchRanking(b);
    let first = null;
    for (let i = 0; i < ranking.length; i++) {
      const v = ranking[i].score_raw;
      if (first === null) first = v;
      else if (v !== first) return true;
    }
    return false;
  });
}

// 归一化：min-max（默认）→ [min_score, max_score]；成本维度按 cost_reverse 反向
function normalizeValue(value, stats, isCost) {
  const lo = typeof NORMALIZATION.min_score === 'number' ? NORMALIZATION.min_score : 0;
  const hi = typeof NORMALIZATION.max_score === 'number' ? NORMALIZATION.max_score : 100;
  const span = stats.max - stats.min;
  if (!isFinite(span) || span === 0) return null; // 无区分度
  let ratio;
  if (isCost && NORMALIZATION.cost_reverse !== false) {
    ratio = (stats.max - value) / span;
  } else if (NORMALIZATION.method === 'ratio-to-max' && !(isCost && NORMALIZATION.cost_reverse !== false)) {
    if (stats.max === 0) return null;
    ratio = value / stats.max;
  } else {
    ratio = (value - stats.min) / span;
  }
  const norm = lo + ratio * (hi - lo);
  return Math.max(lo, Math.min(hi, norm));
}

function computeDimScores() {
  if (!DATA || !DATA.models) return {};
  const cache = {};
  const coverage = {};
  const minCovRatio = (NORMALIZATION.missing_value && typeof NORMALIZATION.missing_value.min_coverage_ratio === 'number')
    ? NORMALIZATION.missing_value.min_coverage_ratio : 0;
  DIMENSIONS.forEach(dim => {
    cache[dim.key] = {};
    coverage[dim.key] = {};
    // 只纳入有区分度（≥2 个不同取值）的数据源；单点数据源不参与归一化，也不计入覆盖分母
    const benches = getUsableBenches(dim.key);
    if (benches.length === 0) return;
    const benchNorm = {};
    benches.forEach(b => {
      const ranking = getBenchRanking(b);
      const scores = ranking.map(r => r.score_raw)
        .filter(s => s != null && typeof s === 'number' && isFinite(s));
      if (scores.length === 0) return;
      benchNorm[b] = {
        max: Math.max(...scores),
        min: Math.min(...scores),
        isCost: isCostBench(b)
      };
    });
    Object.keys(DATA.models).forEach(modelId => {
      let total = 0, totalWeight = 0, covered = 0;
      benches.forEach(b => {
        if (!benchNorm[b]) return;
        const ranking = getBenchRanking(b);
        const entries = ranking.filter(r => r.model_id === modelId)
          .filter(r => r.score_raw != null && typeof r.score_raw === 'number' && isFinite(r.score_raw));
        if (entries.length === 0) return;
        covered++;
        const { max, min, isCost } = benchNorm[b];
        const best = isCost ? Math.min(...entries.map(e => e.score_raw)) : Math.max(...entries.map(e => e.score_raw));
        if (!isFinite(best)) return;
        const norm = normalizeValue(best, { max, min }, isCost);
        if (norm == null || !isFinite(norm)) return;
        const benchWeight = state.benchWeights?.[b] ?? (1 / benches.length);
        total += norm * benchWeight;
        totalWeight += benchWeight;
      });
      coverage[dim.key][modelId] = { covered, sources: benches.length };
      // 缺失策略 exclude_and_reweight 之外再加一道门槛：覆盖源太少则该维度不出分
      if (benches.length > 0 && covered / benches.length < minCovRatio) {
        cache[dim.key][modelId] = null;
        return;
      }
      cache[dim.key][modelId] = totalWeight > 0 ? total / totalWeight : null;
    });
  });
  _dimCoverageCache = coverage;
  return cache;
}

function getDimensionScore(modelId, dimKey) {
  if (!_dimScoresCache) _dimScoresCache = computeDimScores();
  return _dimScoresCache[dimKey] ? _dimScoresCache[dimKey][modelId] : null;
}

// 该模型在该维度覆盖了多少个数据源
function getDimensionCoverage(modelId, dimKey) {
  if (!_dimScoresCache) _dimScoresCache = computeDimScores();
  const c = _dimCoverageCache && _dimCoverageCache[dimKey];
  return c ? c[modelId] : null;
}

function computeDimRanks() {
  if (!DATA || !DATA.models) return {};
  const cache = {};
  DIMENSIONS.forEach(dim => {
    const scores = Object.keys(DATA.models).map(id => ({ id, score: getDimensionScore(id, dim.key) }))
      .filter(s => s.score != null).sort((a, b) => b.score - a.score);
    cache[dim.key] = {};
    scores.forEach((s, i) => { cache[dim.key][s.id] = i + 1; });
  });
  return cache;
}

function getDimensionRank(modelId, dimKey) {
  if (!_dimRankCache) _dimRankCache = computeDimRanks();
  return _dimRankCache[dimKey] ? _dimRankCache[dimKey][modelId] : null;
}

// 是否在九家范围内（参照模型默认不进主榜）
function isInScope(modelId) {
  const m = getModel(modelId);
  if (!m) return true;
  if (typeof m.in_scope === 'boolean') return m.in_scope;
  return m.tier !== 'reference';
}

function getCompositeRanking() {
  if (_compositeCache) return _compositeCache;
  if (!DATA || !DATA.models) return [];
  const activeDims = DIMENSIONS.filter(d => hasDimensionData(d.key));
  const totalActiveDims = activeDims.length;
  const minCovRatio = (NORMALIZATION.missing_value && typeof NORMALIZATION.missing_value.min_coverage_ratio === 'number')
    ? NORMALIZATION.missing_value.min_coverage_ratio : 0;
  const penaltyOn = NORMALIZATION.missing_value && NORMALIZATION.missing_value.coverage_penalty !== false;
  const scored = [];
  Object.keys(DATA.models).forEach(id => {
    let total = 0, totalWeight = 0, dimCount = 0;
    activeDims.forEach(dim => {
      const score = getDimensionScore(id, dim.key);
      if (score != null) {
        const w = state.weights[dim.key] || 0;
        total += score * w;
        totalWeight += w;
        dimCount++;
      }
    });
    const rawScore = totalWeight > 0 ? total / totalWeight : null;
    // 覆盖率惩罚：维度覆盖不足时综合分按比例降低，避免单维度高分模型排名虚高
    const coverage = totalActiveDims > 0 ? dimCount / totalActiveDims : 0;
    let score = rawScore != null ? (penaltyOn ? rawScore * coverage : rawScore) : null;
    // 综合覆盖率低于 config.normalization.missing_value.min_coverage_ratio 时不出分
    if (score != null && totalActiveDims > 0 && coverage < minCovRatio) score = null;
    if (score != null) {
      scored.push({ id, score, rawScore, coverage, reference: !isInScope(id) });
    } else {
      scored.push({ id, score: null, rawScore: null, coverage, reference: !isInScope(id) });
    }
  });
  // 默认只对 in_scope 模型排综合名次；参照模型排在榜尾且带 reference 标记
  const withScore = scored.filter(s => s.score != null);
  const withoutScore = scored.filter(s => s.score == null);
  const main = withScore.filter(s => state.includeReference || !s.reference);
  const refs = state.includeReference ? [] : withScore.filter(s => s.reference);
  main.sort((a, b) => b.score - a.score);
  refs.sort((a, b) => b.score - a.score);
  withoutScore.sort((a, b) => (b.coverage || 0) - (a.coverage || 0));
  let cursor = 0;
  main.forEach(s => { s.rank = ++cursor; });
  refs.forEach(s => { s.rank = ++cursor; });
  withoutScore.forEach(s => { s.rank = ++cursor; });
  _compositeCache = [...main, ...refs, ...withoutScore];
  return _compositeCache;
}

function getReferenceCompositeRanking() {
  return getCompositeRanking().filter(s => s.reference && !state.includeReference);
}

// 「vs 基准」：基准模型综合分；基准缺数据时退回候选列表里第一个有数据的
function getBaselineId() {
  if (state.baseline && getCompositeScore(state.baseline) != null) return state.baseline;
  const fallback = BASELINE_CANDIDATES.find(id => getCompositeScore(id) != null);
  return fallback || null;
}

function getBaselineDelta(modelId) {
  const baseId = getBaselineId();
  if (!baseId) return null;
  const baseScore = getCompositeScore(baseId);
  const score = getCompositeScore(modelId);
  if (baseScore == null || score == null) return null;
  return score - baseScore;
}

function getCompositeScore(modelId) {
  const ranking = getCompositeRanking();
  const item = ranking.find(s => s.id === modelId);
  return item ? item.score : null;
}

function getCompositeRank(modelId) {
  const ranking = getCompositeRanking();
  const item = ranking.find(s => s.id === modelId);
  return item ? item.rank : null;
}

// 参照模型默认不占综合名次（开「含参照模型」后才显示名次）
function getCompositeRankLabel(modelId) {
  const item = getCompositeRanking().find(s => s.id === modelId);
  if (!item || item.score == null) return null;
  if (item.reference && !state.includeReference) return null;
  return item.rank;
}

// 对比视图专用：缺失维度用对比池内最低分填充
function getCompareCompositeScore(modelIds) {
  if (!DATA || !DATA.models || modelIds.length === 0) return {};
  const activeDims = DIMENSIONS.filter(d => hasDimensionData(d.key));

  // 先计算每个维度在对比池内的最低分
  const dimMinScores = {};
  activeDims.forEach(dim => {
    const scores = modelIds.map(id => getDimensionScore(id, dim.key)).filter(s => s != null);
    dimMinScores[dim.key] = scores.length > 0 ? Math.min(...scores) : 0;
  });

  // 记录哪些模型在哪些维度缺失数据
  const missingInfo = {};
  modelIds.forEach(id => { missingInfo[id] = []; });

  const results = {};
  modelIds.forEach(id => {
    let total = 0, totalWeight = 0;
    activeDims.forEach(dim => {
      let score = getDimensionScore(id, dim.key);
      const w = state.weights[dim.key] || 0;
      if (score == null) {
        // 用对比池内最低分填充
        score = dimMinScores[dim.key];
        missingInfo[id].push(dim.name);
      }
      total += score * w;
      totalWeight += w;
    });
    results[id] = {
      score: totalWeight > 0 ? total / totalWeight : null,
      missingDims: missingInfo[id]
    };
  });

  return results;
}

function getModelRankInBench(modelId, benchKey) {
  const ranking = getBenchRanking(benchKey);
  const item = ranking.find(r => r.model_id === modelId);
  return item ? item.rank : null;
}

function invalidateCache() {
  _compositeCache = null;
  _dimScoresCache = null;
  _dimRankCache = null;
  _dimCoverageCache = null;
}

// 数据 / 配置整体替换时清掉 benchmark 排名缓存
function invalidateAllCaches() {
  _benchRankCache = null;
  invalidateCache();
}

function formatScore(v) {
  if (v == null) return '—';
  if (v <= 1.0 && v >= 0) return (v * 100).toFixed(1);
  return Number.isInteger(v) ? v.toString() : v.toFixed(1);
}

function formatCtx(c) {
  if (!c) return '—';
  if (c >= 1000000) return (c / 1000000).toFixed(1) + 'M';
  if (c >= 1000) return (c / 1000).toFixed(0) + 'K';
  return c.toString();
}

function formatCost(v) {
  if (v == null) return '—';
  return '$' + (v < 1 ? v.toFixed(3) : v.toFixed(2));
}

function formatTokens(v) {
  if (v == null) return '—';
  if (v >= 1000000) return (v / 1000000).toFixed(1) + 'M';
  if (v >= 1000) return (v / 1000).toFixed(1) + 'K';
  return v.toString();
}

function getSubDimText(item, benchKey) {
  if (!item) return '';
  if (isCostBench(benchKey)) {
    // 单价类（breakdown 暴露 per_1m 字段）按 /M tok 标注，其余按整轮消耗标注
    const perToken = item.breakdown && typeof item.breakdown === 'object' && item.breakdown.input_per_1m != null;
    return '$' + Number(item.score_raw).toFixed(2) + (perToken ? '/M tok' : '/轮');
  }
  const bd = item.breakdown;
  if (bd && typeof bd === 'object') {
    const acc = (bd.total && bd.total.accuracy != null) ? bd.total.accuracy : bd.accuracy;
    if (acc != null) {
      const hal = (bd.total && bd.total.hallucinationRate != null) ? bd.total.hallucinationRate : bd.hallucinationRate;
      return '准确率 ' + (acc * 100).toFixed(1) + '%' + (hal != null ? ' · 幻觉 ' + (hal * 100).toFixed(0) + '%' : '');
    }
    if (bd.accuracy_pct != null) return '准确率 ' + bd.accuracy_pct + '%';
    if (bd.criteriaPass != null) return '通过率 ' + (bd.criteriaPass * 100).toFixed(1) + '%';
    if (bd.cost_per_task_usd != null) return formatCost(bd.cost_per_task_usd) + '/任务';
    if (bd.output_tokens_per_task != null) return formatTokens(bd.output_tokens_per_task) + ' tok';
  }
  if (item.run_cost_usd != null) return formatCost(item.run_cost_usd) + '/轮';
  if (item.cost_usd != null) return formatCost(item.cost_usd);
  if (item.input_tokens != null) return formatTokens(item.input_tokens) + ' tok';
  return '';
}

function getMarkers(model) {
  let html = '<div class="marker-cell">';
  // 参照模型（不在九家范围）标记
  if (model && isInScope(model.id) === false) html += '<span class="marker ref">参照</span>';
  // 模态标签
  if (model.supports_vision && model.supports_audio) html += '<span class="marker mm">多模态</span>';
  else if (model.supports_vision) html += '<span class="marker mm">多模态</span>';
  else if (model.supports_audio) html += '<span class="marker tts">TTS</span>';
  else html += '<span class="marker text">文本</span>';
  // 开源状态标签
  if (model.open_source === 'Open') html += '<span class="marker open">开源</span>';
  else if (model.open_source === 'Proprietary') html += '<span class="marker closed">闭源</span>';
  else if (model.open_source === 'Hybrid') html += '<span class="marker mixed">混合</span>';
  html += '</div>';
  return html;
}

function getReasoningLevels(modelId, benchKey) {
  const ranking = getBenchRanking(benchKey);
  const entries = ranking.filter(r => r.model_id === modelId);
  if (entries.length <= 1) return [];
  const isCost = isCostBench(benchKey);
  const sorted = [...entries].sort((a, b) => isCost ? a.score_raw - b.score_raw : b.score_raw - a.score_raw);
  sorted.forEach((e, i) => {
    e.label = e.reasoning_level || '默认';
    e.best = i === 0;
  });
  return sorted;
}

function getThemeColor(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

// ===== DIMENSION NAV =====
function renderDimensionNav() {
  const dimTabs = document.getElementById('dim-tabs');
  const benchChips = document.getElementById('bench-chips');
  if (!DATA) return;

  dimTabs.innerHTML = DIMENSIONS.map(dim => `
    <button class="dim-tab ${state.activeDimension === dim.key ? 'active' : ''}" data-dim="${dim.key}" data-tooltip="${dim.desc.replace(/"/g, '&quot;')}">
      <span class="dim-tab-name">${dim.name}</span>
    </button>
  `).join('');

  dimTabs.querySelectorAll('.dim-tab').forEach(btn => {
    btn.addEventListener('click', (e) => {
      // 点击问号不切换维度
      if (e.target.classList.contains('dim-help-icon')) return;
      state.activeDimension = btn.dataset.dim;
      const benches = getBenchmarksByDimension(state.activeDimension);
      state.activeBench = benches.length > 0 ? benches[0] : null;
      state.expandedModel = null;
      renderDimensionNav();
      renderCurrentView();
    });
  });

  // 绑定维度 tab 的 tooltip
  dimTabs.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', showTooltip);
    el.addEventListener('mouseleave', hideTooltip);
  });

  const benches = getBenchmarksByDimension(state.activeDimension);
  const hasBenches = benches.length > 0;

  if (hasBenches) {
    benchChips.innerHTML = benches.map(b => {
      const desc = benchTooltip(b);
      const status = benchStatus(b);
      return `<button class="bench-chip ${state.activeBench === b ? 'active' : ''}" data-bench="${b}" data-tooltip="${desc.replace(/"/g, '&quot;')}">${benchLabel(b)}${status ? `<span class="chip-status">${status}</span>` : ''}</button>`;
    }).join('');
    benchChips.classList.add('visible');

    benchChips.querySelectorAll('.bench-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeBench = btn.dataset.bench;
        state.expandedModel = null;
        renderDimensionNav();
        renderCurrentView();
      });
    });

    // 绑定 benchmark chip 的 tooltip
    benchChips.querySelectorAll('[data-tooltip]').forEach(el => {
      el.addEventListener('mouseenter', showTooltip);
      el.addEventListener('mouseleave', hideTooltip);
    });
  } else {
    benchChips.innerHTML = '<span style="font-size:12px;color:var(--text-tertiary);padding:6px 0">数据待入库</span>';
    benchChips.classList.add('visible');
  }
}

// HTML 转义：任何来自 data.json 的字符串在拼 innerHTML 前都要过这里。
// 原先只在「数据说明」视图里有个局部副本，榜单视图调用会 ReferenceError，故提到模块级。
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ===== 榜单视图（能力榜 / 性价比榜 / 综合榜）=====
// 为什么拆三榜（docs/changelog.md #29）：单一综合分里"成本该占多少权重"没有客观答案。
// 实测本批整轮评测消耗从 $7 到 $1094（156 倍），线性归一会让三个能力维都第一的
// Claude Fable 5.1 因最贵而综合排第 9。拆成"有多强"和"值不值"两个视角更诚实。
// 能力榜与性价比榜的分数由服务端按 config.leaderboards 算好写入 models[].scores，
// 口径固定、不随手调权重变化；只有综合榜跟随当前权重实时重算。
function boardScore(id, board) {
  if (board === 'composite') return getCompositeScore(id);
  const s = (getModel(id) || {}).scores || {};
  return (s[board] === undefined || s[board] === null) ? null : s[board];
}

function boardValueRaw(id) {
  const s = (getModel(id) || {}).scores || {};
  return s.value_raw != null ? s.value_raw : null;
}

function renderBoardView() {
  const main = document.getElementById('main');
  document.getElementById('dimension-nav').style.display = 'none';
  if (!DATA) return;

  const LB = (DATA.config && DATA.config.leaderboards) || {};
  const boards = ['capability', 'value', 'composite'].filter(k => LB[k]);
  if (!boards.includes(state.board)) state.board = boards[0] || 'capability';
  const active = LB[state.board] || {};

  if (state.board !== 'composite' && !Object.values(DATA.models).some(m => m.scores && m.scores[state.board] != null)) {
    main.innerHTML = '<div class="empty"><div class="empty-icon">📊</div>'
      + '<div class="empty-text">该榜单分数尚未由导出器写入 data.json，请重跑 scripts/export_frontend_data.py</div></div>';
    return;
  }

  let ids = Object.keys(DATA.models).filter(id => {
    const m = getModel(id);
    if (!m) return false;
    if (state.searchQuery) {
      const q = state.searchQuery.toLowerCase();
      if (!(m.display_name || id).toLowerCase().includes(q) && !id.toLowerCase().includes(q)) return false;
    }
    if (state.activeProviders.size > 0 && !state.activeProviders.has(m.provider)) return false;
    return true;
  });

  const rows = ids.map(id => ({
    id, score: boardScore(id, state.board), ref: !isInScope(id),
    price: (getModel(id).scores || {}).blended_price,
  }));
  const ranked = rows.filter(r => r.score != null && (state.includeReference || !r.ref));
