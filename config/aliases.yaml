# Model Alias 配置 — 手动确认的映射
#
# 范围: 仅九家封闭厂商 (2026-06-17 确认)
#   御三家: OpenAI / Anthropic / Google
#   国内六家: DeepSeek / GLM(智谱) / Kimi(月之暗面) / Qwen(阿里) / MiMo(小米) / MiniMax
#
# 已移除: xAI / Meta / Mistral / Amazon / Nvidia
#
# 格式:
#   canonical: OpenRouter model ID (主键, provider/model-slug)
#   aliases: 从各 benchmark 数据源来的别名列表
#   sources: 哪些数据源使用这些别名 (arena/swe/gpqa/lcb)
#
# 生成方式:
#   1. scripts/build_alias_candidates.py 自动生成候选
#   2. 人工审核确认
#   3. 写入此文件

aliases:
  # ===== OpenAI =====
  - canonical: "openai/gpt-4o"
    aliases: ["GPT-4O", "gpt-4o", "GPT-4o"]
    sources: [arena]

  - canonical: "openai/gpt-4o-2024-08-06"
    aliases: ["GPT-4O-2024-08-06", "gpt-4o-2024-08-06"]
