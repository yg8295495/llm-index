        confidence: 0.80
        status: stale          # v4 由 AA 提供的合成指数, 本批次 payload 中不存在

  # =========================================================================
  # 维度 3: Engineering — 工程能力 / 编码
  # =========================================================================
  engineering:
    name: "工程能力"
    description: "终端操作 + 科学编程 + 实时编程 + 长上下文代码"
    weight: 0.20

    sources:
      terminalbench_hard:
        aa_key: terminalbenchHard
        name: "终端任务Hard (Terminal-Bench Hard)"
        scale: ratio
        direction: higher
        tier: primary
        coverage: 7
        freshness: snapshot
        confidence: 0.85
        status: beta           # 本批次仅 7 个模型有值
        source_url: "https://artificialanalysis.ai/evaluations/terminalbench-hard"
        official_url: "https://www.tbench.ai/"
        note: "v4 用它派生 cost_per_task; v5 改用 canonicalEvalTokenCounts × 定价直接算"

      terminalbench_v2_1:
        aa_key: terminalBench21
        name: "终端任务 v2.1 (Terminal-Bench 2.1)"
        scale: ratio
        direction: higher
