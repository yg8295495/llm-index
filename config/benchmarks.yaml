        name: "综合知识指数 (AA-Omniscience)"
        type: index
        scale: index            # 可为负: 惩罚乱猜后的净得分
        direction: higher
        breakdown_key: omniscienceBreakdown   # accuracy / hallucinationRate / attemptRate / byDomain
        tier: primary
        coverage: 31
        freshness: snapshot
        confidence: 0.90
        status: production
        source_url: "https://artificialanalysis.ai/evaluations/omniscience"
        methodology_url: "https://arxiv.org/abs/2511.13029"

      gpqa:
        aa_key: gpqa
        name: "研究生问答 (GPQA Diamond)"
        scale: ratio
        direction: higher
        tier: primary
        coverage: 29
        freshness: snapshot
        confidence: 0.90
        status: production
        source_url: "https://artificialanalysis.ai/evaluations/gpqa"

      hle:
        aa_key: hle
        name: "人类终极考试 (Humanity's Last Exam)"
        scale: ratio
        direction: higher
        tier: primary
        coverage: 31
        freshness: snapshot
        confidence: 0.85
        status: production
        source_url: "https://artificialanalysis.ai/evaluations/hle"

