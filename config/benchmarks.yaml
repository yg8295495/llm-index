      coding_index:
        name: "编程综合指数 (Coding Index)"
        type: composite
        scale: index
        direction: higher
        tier: primary
        coverage: 0
        freshness: snapshot
        confidence: 0.80
        status: stale

  # =========================================================================
  # 维度 4: Cost — 使用成本
  # =========================================================================
  cost:
    name: "成本"
    description: "跑同一评测集的实际消耗 + API 定价"
    weight: 0.15

    sources:
      cost_per_task:
        name: "实际消耗 (Cost per Task)"
        type: derived
        scale: usd
        direction: lower        # 越便宜分越高
        tier: primary
        coverage: 30
        freshness: snapshot
        confidence: 0.85
        status: production
        derived_from:
          tokens_key: canonicalEvalTokenCounts   # 每评测 input/answer/reasoning token 数
          price_keys: [price1mInputTokens, price1mOutputTokens, cacheHitPrice]
        note: >-
          由 AA payload 的 canonicalEvalTokenCounts 与该模型 API 定价相乘得出,
          口径为"跑完该评测一次的美元消耗", 比单纯定价更能反映推理型模型的真实成本。

      pricing:
        name: "定价参考 (API Pricing)"
        type: api
        scale: usd
        direction: lower
        tier: secondary
        coverage: 30
        freshness: snapshot
        confidence: 0.90
        status: production
        derived_from:
          price_keys: [price1mInputTokens, price1mOutputTokens, cacheHitPrice, cacheWritePrice]
        unit: "USD / 1M tokens"

  # =========================================================================
  # 维度 5: Preference — 人类偏好
  # =========================================================================
  preference:
    name: "人类偏好"
    description: "真实用户盲测偏好 (Chatbot Arena)"
    weight: 0.15

    sources:
      lmarena_text:
        name: "LMArena (Chatbot Arena)"
        scale: elo
        direction: higher
        tier: primary
        coverage: 0              # 本批次未采集; 库里 69 条属 2026-06-17 快照, 全部为已下架模型
        freshness: snapshot
        confidence: 0.95
        status: empty
        source_url: "https://lmarena.ai/leaderboard"
        note: >-
          本批次无新模型 LMArena 数据, 综合指数按 settings.yaml 的
          weights_no_preference 自动把这 15% 重新分配给其余四维。
          补齐该维度需另跑 LMArena 采集, 已列入 docs/changelog.md 待办。

  # =========================================================================
  # 标签 (不参与评分)
  # =========================================================================
  tags:
    accessibility:
      name: "可访问性"
      description: "国内可访问性 / 官方订阅门槛 / 封号风险"
      scoring: false
      source: config/accessibility.yaml
    openness_index:
      name: "开放度"
      description: "AA Openness Index, 权重开放/协议友好度"
      scoring: false
      aa_key: opennessIndex
      source_url: "https://artificialanalysis.ai/methodology/openness-index"
    answer_speed:
      name: "作答速度"
      description: "AA 标准化评测下的输出速度"
      scoring: false
      aa_key: medianCanonicalAnswerOutputSpeed
      unit: "tokens/s"

