        scale: ratio
        direction: higher
        breakdown_key: harveyLabBreakdown
        tier: secondary
        coverage: 13
        freshness: snapshot
        confidence: 0.75
        status: beta
        source_url: "https://artificialanalysis.ai/evaluations/harvey-lab"

      critpt:
        aa_key: critpt
        name: "反事实陷阱问答 (CritPT)"
        scale: ratio
        direction: higher
        tier: secondary
        coverage: 31
        freshness: snapshot
        confidence: 0.75
        status: production
        source_url: "https://artificialanalysis.ai/evaluations/critpt"

      intelligence_index:
        aa_key: intelligenceIndex
        name: "AA 智能指数 (Intelligence Index)"
        scale: index
        direction: higher
        tier: primary
        coverage: 31
        freshness: snapshot
        confidence: 0.85
        status: production
        note: "AA 自研综合指数, 跨全部评测加权; 本站综合指数与它并列展示但不重复计入"

      # v4 保留但本批次 AA 未提供数值的历史数据源
      aime:
        name: "数学邀请赛 (AIME)"
        scale: ratio
        direction: higher
        tier: secondary
        coverage: 0
        freshness: snapshot
        confidence: 0.85
        status: stale

  # =========================================================================
  # 维度 2: Workflow — 工作流 / Agent 能力 / 指令遵循
  # =========================================================================
  workflow:
    name: "工作流"
    description: "Agent 端到端执行 + 指令遵循 + 真实职业任务"
    weight: 0.25

    sources:
