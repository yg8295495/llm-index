      mmmu_pro:
        aa_key: mmmuPro
        name: "多模态学科理解 (MMMU-Pro)"
        scale: ratio
        direction: higher
        tier: secondary
        coverage: 19
        freshness: snapshot
        confidence: 0.80
        status: production
        source_url: "https://artificialanalysis.ai/evaluations/mmmu-pro"

      harvey_lab:
