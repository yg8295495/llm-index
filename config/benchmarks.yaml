        scale: ratio
        direction: higher
        tier: secondary
        coverage: 1
        freshness: snapshot
        confidence: 0.85
        status: stale          # 本批次 AA 仅在 1 个模型上给出, 不足以支撑横向比较
        source_url: "https://artificialanalysis.ai/evaluations/aime-2025"

      mmlu_pro:
