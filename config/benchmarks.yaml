        scale: ratio
        direction: higher
        tier: secondary
        coverage: 31
        freshness: snapshot
        confidence: 0.80
        status: production
        note: "v4 未注册; 0 值需与'未测'区分, 采集时对 0 保留但标 confidence"

      scicode:
        aa_key: scicode
        name: "科学编程 (SciCode)"
        scale: ratio
        direction: higher
        tier: primary
        coverage: 31
        freshness: snapshot
        confidence: 0.85
        status: production
        source_url: "https://artificialanalysis.ai/evaluations/scicode"

      livecodebench:
        aa_key: livecodebench
        name: "实时编程 (LiveCodeBench)"
        scale: ratio
        direction: higher
        tier: secondary
        coverage: 1
        freshness: snapshot
        confidence: 0.80
        status: stale
        source_url: "https://artificialanalysis.ai/evaluations/livecodebench"

      lcr:
        aa_key: lcr
        name: "长上下文代码检索 (LCR)"
        scale: ratio
        direction: higher
        tier: primary
