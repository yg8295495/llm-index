# Benchmark Registry v5 — 五维度数据源注册表
#
# 更新: 2026-09-20
# 变更 (相对 v4, 详见 docs/changelog.md):
#   1. 每个 AA 数据源新增 `aa_key`, 声明它在 AA payload 里的原始字段名。
#      采集与导出都以本文件为准, 不再在 Python / JS 里各写一份映射。
#   2. freshness 全部改为如实描述。AA 不提供逐项评测日期, 因此统一为
#      `snapshot` (快照), 含义是"本批次采集日 AA 页面上的数值", 不假装精确。
#   3. coverage 用本批次真实计数, 不再沿用 v4 手写的 209。
#   4. 新增 AA 本批次带分但 v4 未注册的 11 项评测。
#   5. 声明九家范围外的 tier=reference 模型不参与本表任何维度的综合计算。
#
# 字段说明:
#   aa_key:      AA payload 里的原始字段名 (缺省表示不由 collect_aa_v3 采集)
#   scale:       raw = 原样入库; 用于前端展示时按 direction 归一化
#   direction:   higher | lower
#   tier:        primary | secondary
#   coverage:    本批次 (2026-09-20) 有非空数值的模型数
#   confidence:  数据可信度 0-1
#   status:      production | beta | stale | empty

meta:
  version: 5
  updated: "2026-09-20"
  primary_source: "Artificial Analysis — AA-Omniscience 评测页"
  model_scope: "九家封闭厂商 (见 config/vendors.yaml tier=core)"

# =========================================================================
# 数据来源口径 — 前端"数据说明"页与每条分数的标注都引用这里
# =========================================================================
provenance:
  leaderboard_url: "https://artificialanalysis.ai/evaluations/omniscience"
  dataset_url: "https://huggingface.co/datasets/ArtificialAnalysis/AA-Omniscience-Public"
  paper_url: "https://arxiv.org/abs/2511.13029"
  license: "AA-Omniscience-Public 题库为 Apache-2.0; 榜单数值版权归 Artificial Analysis"
  # 诚实声明: 这三个日期字段含义不同, 不可混用
  date_semantics:
    observed_at: "AA 快照日期, 即本条数值所属的 AA 页面批次日"
    collected_at: "我们从 AA 页面取到该数值的 UTC 时间戳"
    release_date: "模型发布日期, 来自 AA payload 的 releaseDate (AA 提供)"
  caveat: >-
    Artificial Analysis 未在其评测数据中公布逐项 benchmark 的评测执行日期,
    因此本站所有分数标注为"某日 AA 快照", 不标注虚构的评测日期。
    官方题库为总题量的 10% 子集 (600/6000 题), 域级/语言级细分不具备统计代表性,
    本站只使用总分与官方公布的分项指标。

dimensions:

  # =========================================================================
  # 维度 1: Factual — 事实准确 / 知识储备 / 幻觉控制
  # =========================================================================
  factual:
    name: "事实准确"
    description: "知识储备 + 幻觉控制 + 专业领域准确性"
    weight: 0.25

    sources:
      aa_omniscience:
