# Agent 框架
agent_frameworks:
  - id: "openclaw"
    name: "OpenClaw"
    provider: "Community"
    type: "agent"
    base_model: "gpt-4o"  # 可指定默认使用的底层模型
    features:
      - "multi_turn_dialogue"
      - "code_execution"
      - "task_planning"
      - "tool_integration"
    active: true

  - id: "hermes"
    name: "Hermes"
    provider: "Community"
    type: "agent"
    base_model: "claude-3-5-sonnet"
    features:
      - "multi_turn_dialogue"
      - "task_planning"
      - "tool_integration"
    active: true

# 维度映射说明
# base_models 的维度: coding, planning, tool_use, knowledge, cost, workflow
# agent_frameworks 的维度: coding, planning, tool_use, knowledge, cost, workflow, multi_turn_dialogue, code_execution, task_planning, tool_integration
