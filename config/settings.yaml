# LLM-INDEX 权重与计算配置 v5
#
# 更新: 2026-09-20
# 维度体系以 config/benchmarks.yaml 为唯一准 (v5)
# 本文件是"怎么算"的唯一权威: 权重、归一化、基准模型、预设方案。
#
# v5 变更 (详见 docs/changelog.md #7 #8):
#   - normalization.method 从口头声明的 "min-max" 落实为真正生效的实现,
#     并新增 negative_cap: 处理 AA-Omniscience 这类可为负的指数。
#   - 新增 presets: 供前端"我的方案"预置, 也是 tests/test_calculator.py 的断言依据。
#   - baseline_model 从 deepseek-v4-pro 改为 openai/gpt-5.6-terra (用户 2026-09-20 指定),
#     并给出候选列表, 前端可切换。
#   - 新增 snapshot: 采集快照的落盘与保留策略。

# =========================================================================
# 默认权重（5 维评分，总和 = 1.0）
# =========================================================================
weights:
  factual: 0.25           # 事实准确 (AA-Omniscience / GPQA / HLE / 智能指数)
  workflow: 0.25          # 工作流 (GDPval / Briefcase / IFBench / Tau-2)
  engineering: 0.20       # 工程能力 (Terminal-Bench / SciCode / LCR / MLCR)
  cost: 0.15              # 成本 (实际消耗 / 定价参考)
  preference: 0.15        # 人类偏好 (LMArena, 本批次无数据)

# =========================================================================
# 无 preference 数据时的等效权重（自动重新分配）
# 本批次 (2026-09-20) preference 覆盖为 0, 综合指数实际按本组权重计算
# =========================================================================
weights_no_preference:
  factual: 0.29           # 0.25 / 0.85 ≈ 0.29
  workflow: 0.29          # 0.25 / 0.85 ≈ 0.85 归一后
  engineering: 0.24
  cost: 0.18
  preference: 0.00

# =========================================================================
# 预设方案（前端"我的方案"初始值; 键名即展示名）
# =========================================================================
presets:
  综合均衡:
    description: "默认口径, 五维加权, 适合没有明确任务倾向时的起点"
    weights: { factual: 0.25, workflow: 0.25, engineering: 0.20, cost: 0.15, preference: 0.15 }
  编程优先:
    description: "以工程能力为主, 兼顾成本"
    weights: { factual: 0.15, workflow: 0.20, engineering: 0.40, cost: 0.15, preference: 0.10 }
  Agent工作流优先:
    description: "端到端自主执行任务的能力权重最高"
    weights: { factual: 0.15, workflow: 0.45, engineering: 0.15, cost: 0.15, preference: 0.10 }
  成本敏感:
    description: "先卡预算, 再看能力, 适合高频调用场景"
    weights: { factual: 0.20, workflow: 0.20, engineering: 0.15, cost: 0.40, preference: 0.05 }
  事实可靠:
    description: "需要低幻觉的问答/检索场景, 事实准确权重最高"
    weights: { factual: 0.45, workflow: 0.15, engineering: 0.10, cost: 0.15, preference: 0.15 }

# =========================================================================
# 榜单形态（2026-09-20 与用户对齐: 双榜）
#
#   为什么双榜: 单一综合分无法回避"成本该占多少权重"。实测本批 18 个核心模型的
#   整轮评测消耗从 $7 到 $1094（156 倍），线性 min-max 会让最贵的 Claude Fable 5.1
#   在成本维直接 0 分 —— 它三个能力维都是全场第一，综合却排第 9。
#   把"有多强"和"值不值"拆成两榜，比在综合分里藏一个主观权重更诚实。
# =========================================================================
leaderboards:
  capability:
    name: "能力榜"
    caption: "不计成本，只看任务能力。回答\"哪来做得到\""
    # 参与维度与权重；权重会按参与维度重新归一化
    dimensions:
      factual: 0.25
      workflow: 0.25
      engineering: 0.20
      preference: 0.15      # 本批无数据时自动剔除并重归一
  value:
    name: "性价比榜"
    caption: "能力分 ÷ 混合单价。回答\"同样的钱选谁\""
    formula: "capability_score / blended_price_per_1m"
    # 单价跨 3 个数量级 (0.15 ~ 50 USD/1M)，直接相除会被价格主导，
    # 因此对能力分保持原值、对比值做 min-max 展示归一
    display_scale: "min-max"
    unit: "分 / (USD·1M token)"
    floor_price: 0.01       # 防止单价缺失或为 0 时除零
  composite:
    name: "综合榜"
    caption: "按 weights 加权能力维 + 成本维的折中值，保留给想看单一数的人"
    note: "成本维为线性 min-max，价格主导明显，慎作唯一依据"

# =========================================================================
# 归一化配置
# =========================================================================
normalization:
  method: "min-max"        # 分数维度也用 min-max, 与 Python 实现和前端保持一致
  min_score: 0
  max_score: 100
  cost_reverse: true       # cost 维度反向: 消耗越低得分越高

  # 关键修正: AA-Omniscience 等指数可为负 (本批次 -49.25 ~ 43.73)。
  # 旧的"比值法"(best / max * 100) 在负值上会算出负得分并把名次算反。
  negative_cap:
    enabled: true
    floor: 0               # 归一化结果钳在 [0, 100]
    note: "对 scale=index 且允许为负的数据源强制走 min-max, 不使用比值法"

  # 缺失值处理: 某维度全部无数据则该维度不计权重; 单条缺失按覆盖度惩罚
  missing_value:
    strategy: "exclude_and_reweight"
    coverage_penalty: true   # 前端综合排名对评测覆盖不足的模型按比例降权
    min_coverage_ratio: 0.34 # 至少覆盖该维度 1/3 的数据源才参与该维度排名

# =========================================================================
# 基准模型（对比锚点）
# =========================================================================
baseline_model:
  default: "openai/gpt-5.6-terra"
  candidates:
    - "openai/gpt-5.6-terra"
    - "openai/gpt-5.6-luna"
    - "deepseek/deepseek-v4-pro"
  description: >-
    用户 2026-09-20 指定以 GPT-5.6 Terra/Luna 作为选型基准锚点:
    Terra 为中档主力, Luna 为轻量档。全部对比视图与"相对基准"列以此为准。

# =========================================================================
# 采集快照策略
# =========================================================================
snapshot:
  dir: "data/raw/snapshots"       # 每次采集一个日期子目录
  keep_raw_html: true             # 原始 HTML 落盘但不入库 (体积), 只提交解析产物
  commit_parsed: true             # 解析后的 JSON 快照提交进 git, 供他人复现
  source_url: "https://artificialanalysis.ai/evaluations/omniscience"
  # observed_at 语义: AA 未公布逐项评测日期, 快照日期即采集日 (见 benchmarks.yaml provenance)

# =========================================================================
# 数据采集配置
# =========================================================================
ingestion:
  # 2026-09-20: 暂无调度器读取本节; AA 已改为加密 data blob + 前端解密,
  # 全自动采集不再可靠. 采集节奏由人工触发 collect_aa_v3.py 决定.
  schedule:
    manual: true
    suggested: "月度或九家有新模型发布时"
  retry_attempts: 3
  timeout_seconds: 30
