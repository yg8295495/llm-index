# Endpoint Pool — 已验证的数据采集端点
# 基于 2026-06-16 实测经验建立
# 用途: web-data-scout Skill 和采集脚本参考
#
# 端点分类:
#   api       — 有标准 API, 可用 httpx 直接调用
#   playwright — 需 Playwright 浏览器渲染后提取
#   html      — 静态 HTML, 可用 httpx + BeautifulSoup
#   image     — 数据在图片中, 需 OCR/视觉识别
#   manual    — 需人工采集
#
# 状态:
#   verified  — 已实测成功
#   untested  — 未测试
#   broken    — 已知不可用

endpoints:

  # =========================================================================
  # Artificial Analysis (AA) — 多个评测维度
  # =========================================================================
  - name: "AA-Omniscience"
    url: "https://artificialanalysis.ai/evaluations/omniscience"
    method: playwright
    status: verified
    notes: "数据在 RSC inline payload 的 <script> 标签中, Playwright 加载后提取"
    data_file: "data/raw/aa_omniscience_2026-06-16.yaml"
    coverage: 28
    last_verified: "2026-06-16"

