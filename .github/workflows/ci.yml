name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q
      - name: ruff (F,E9)
        run: python -m ruff check src scripts tests --select F,E9
      - name: 管线干跑（不写库、不落盘）
        run: python scripts/refresh_data.py
