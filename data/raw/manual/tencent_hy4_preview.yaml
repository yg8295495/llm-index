# 混元 Hy4 preview — 官方自报评测数据登记
#
# 为什么走人工登记: Artificial Analysis 尚未收录该模型
#   (2026-09-21 复核: /models/hy4、/models/hy4-preview 仍 404; AA 全站注册表 862 个
#    slug 里腾讯只有 hy3 / hy3-preview / hy3-non-reasoning; AA changelog 零 hy4 提及)。
#   用户 2026-09-20 明确这是他常选的模型, 缺了他无法判断, 因此收录官方口径数据。
#
# 口径警告: 下列分数由厂商自行发布, **不与 AA 同口径**, 不得混入同一个归一化排名。
#   站内证据: 官方称 Hy3 在 Terminal-Bench 2.1 得 70.8, 而 AA 对 Hy3 的同类测量是
#   64.42 (snapshot 2026-09-20), 差 6.4 分 —— 实现/版本/采样设置不同。
#   因此本站把这类数据标为 source=tencent_official, 只在模型详情里单独展示,
#   不参与能力榜/性价比榜/综合榜的任何计算。
#
# 数据来源与核验方式: 数值取自腾讯官方附表图片
#   https://raw.githubusercontent.com/Tencent-Hunyuan/Hy4-preview/main/assets/benchmark-appendix.jpg
#   (4960x10840, 2026-09-21 由本项目下载后切图逐行读图核对, 非二手转述)。
#   该表把 8 个模型放在同一列体系里由腾讯同一 harness 跑出, 因此**表内横向相对名次
#   比单看绝对分更有意义**; 表内带 * 的是引用值, 不带 * 的是腾讯自跑。
#
# 独立交叉核对 (未入库, 仅记档):
#   - Code Arena Elo 1624, 名次区间 9-17 (2026-09-12)
#   - 前端 WebDev Arena Elo 1641±15, 全球名次 8-17, 1.9K 票, 标 Preliminary/Unstable
#     (2026-09-16)
#   两条都来自 lmarena 体系, 但本项目直连 lmarena.ai 失败, 数值取自第三方镜像
#   (aitntnews.com), 可信度低于 AA, 因此不写入 benchmark_evals, 只在此登记。
#   Expert Arena / Agent Arena 无 hy4 条目。钛媒体 2026-08-31 自述:
#   "独立机构的大规模横评还没出来…目前一半还靠官方自己的数据撑着"。

